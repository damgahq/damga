name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  IMAGE_TAG: 1.0.0
  # The owner this job bootstraps, so a later step can reach the API as
  # somebody. Not a secret: it belongs to a cluster this job creates and
  # deletes, reachable from nothing outside the runner. See the bootstrap call
  # for why a literal is the least bad of the three options.
  CI_OWNER_PASSWORD: ci-owner-password-not-a-secret
  # One string, because the build pod and the kubelet have to agree on it: the
  # image reference recorded in a Workload is what the kubelet pulls, and it is
  # the same reference the build pushed. cluster/registry.yaml explains why that
  # takes a node-side redirect.
  REGISTRY_HOST: registry.damga-registry.svc:5000

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- code
  test:
    name: Lint and test
    runs-on: ubuntu-latest

    # A job with no ceiling is not a job that runs longer; it is a job that can
    # stop reporting. buildkit swallowed a segfaulting emulated build and waited
    # six hours for it, and the pipeline said nothing the whole time. Every
    # ceiling here is several times the measured duration — long enough that a
    # cold cache never trips it, short enough that a hang is news the same hour.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run lint
        working-directory: app
      - run: npm test
        working-directory: app

      # The panel, in the same runner and with nothing installed. It has no
      # package.json and needs none: node --test is built in, which is what
      # lets the package keep its argument against a build step while still
      # having tests. It had none until the one place it decides anything was
      # found deciding wrongly.
      - run: node --test panel/*_test.js

  # ------------------------------------------------------- static analysis
  manifests:
    name: Validate manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.3

      - name: Helm lint
        run: helm lint chart

      - name: Render every values profile
        run: |
          for f in chart/values.yaml chart/values-dev.yaml chart/values-prod.yaml chart/values-public.yaml; do
            echo "::group::$f"
            helm template ci chart -f "$f" --set postgres.auth.password=ci
            echo "::endgroup::"
          done

      # The CRD catalog is given explicitly rather than reaching for
      # -ignore-missing-schemas. That flag would make a CRD-backed manifest pass by
      # not being checked at all, and quietly do the same for the next custom
      # resource added here.
      - name: Validate the hand-written manifests
        run: |
          curl -sSLo kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform.tar.gz kubeconform
          ./kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            policies/ gitops/ cluster/registry.yaml cluster/build-namespace.yaml cluster/control-plane.yaml

      - name: Validate rendered manifests against the Kubernetes schema
        run: |
          helm template ci chart -f chart/values-prod.yaml --set postgres.auth.password=ci \
            | ./kubeconform -strict -summary -ignore-missing-schemas -

      # Terraform is validated, never applied: this pipeline has no cluster it
      # is entitled to change, and a plan against one it does not own would be
      # either meaningless or dangerous.
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.1
          terraform_wrapper: false

      - name: Terraform formatting and validity
        run: |
          terraform -chdir=terraform fmt -check -diff
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate

      - name: Lint the API Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: app/Dockerfile
          failure-threshold: warning

      - name: Lint the operator Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile.operator
          failure-threshold: warning

  # ------------------------------------------------------------- container
  image:
    name: Build and scan image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t "damga-app:${IMAGE_TAG}" ./app

      - name: Container must not run as root
        run: |
          uid=$(docker run --rm "damga-app:${IMAGE_TAG}" id -u)
          echo "container uid: $uid"
          [ "$uid" != "0" ] || { echo "image runs as root"; exit 1; }

      - name: Container must start with a read-only root filesystem
        run: |
          docker run -d --name ro --read-only --cap-drop ALL \
            --security-opt no-new-privileges -p 8080:3000 "damga-app:${IMAGE_TAG}"
          for _ in $(seq 1 20); do curl -sf localhost:8080/healthz && break || sleep 1; done
          curl -sf localhost:8080/healthz | grep -q ok
          docker rm -f ro

      - name: Scan the API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: damga-app:${{ env.IMAGE_TAG }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Build the operator image
        run: docker build -f Dockerfile.operator -t "damga-operator:${IMAGE_TAG}" .

      - name: Operator container must not run as root
        run: |
          uid=$(docker inspect "damga-operator:${IMAGE_TAG}" --format '{{.Config.User}}')
          echo "operator user: $uid"
          case "$uid" in 0|root|""|0:*|root:*) echo "operator image runs as root"; exit 1 ;; esac

      - name: Scan the operator image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: damga-operator:${{ env.IMAGE_TAG }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      # The control plane joined this job the same day it started being
      # published. Before that it was built in the cluster job and thrown away
      # with the cluster, so nothing left the machine unscanned. A published
      # image that no gate has looked at is a different thing, and the two
      # changes belong in the same commit rather than one push apart.
      - name: Build the control plane image
        run: docker build -f Dockerfile -t "damga-control-plane:${IMAGE_TAG}" .

      - name: Control plane container must not run as root
        run: |
          uid=$(docker inspect "damga-control-plane:${IMAGE_TAG}" --format '{{.Config.User}}')
          echo "control plane user: $uid"
          case "$uid" in 0|root|""|0:*|root:*) echo "control plane image runs as root"; exit 1 ;; esac

      - name: Scan the control plane image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: damga-control-plane:${{ env.IMAGE_TAG }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  # ------------------------------------------------ the installer, for real
  #
  # Nothing executed scripts/install.sh until this job existed. Its own test
  # exercises DRY_RUN, which by construction cannot see anything that only
  # fails against a real API server — and both blockers found on 2026-09-02
  # were exactly that: a container path that does not resolve in a distroless
  # image, and a wait that answered before the object existed.
  #
  # Its own job rather than a step in the cluster job, and the reason is
  # measured. A second install.sh run against a cluster that already has one is
  # idempotent but not inert: 103 resources unchanged, 8 configured, 2 created,
  # and the ones that move are the ingress controller's Deployment, its Service
  # and its admission-webhook jobs. The cluster job asserts HTTPS, the redirect,
  # the Secure cookie and ingress routing through that controller. Restarting
  # the thing under test mid-job produces flakes that read as product bugs.
  #
  # What it tests is the INSTALLER against the PUBLISHED product: install.sh
  # pulls the operator by tag and the control plane by digest, so a regression
  # in the images this commit builds is the cluster job's ground, not this
  # one's. What a user runs is what this one runs.
  install:
    name: The installer builds a cluster
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [test, manifests]
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.3
      - name: Create kind cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: install
          config: kind-config.yaml
          version: v0.33.0
          node_image: kindest/node:v1.36.4
      # Before install.sh, not after. Its last step creates the first owner
      # through `kubectl exec`, and kind-config.yaml has the kubelets ask the
      # cluster CA for serving certificates that nothing auto-approves. Without
      # this the exec fails with "remote error: tls: internal error" at step 14,
      # having done every other step correctly. Measured 2026-09-02.
      - name: Approve kubelet serving certificates
        run: ./scripts/approve-kubelet-certs.sh
      # The exit code is the assertion. install.sh runs under `set -euo
      # pipefail`, so 0 means all fourteen steps applied — the operator and
      # Argo CD included, which it did not install until today.
      #
      # --skip-node-config leaves the containerd redirect unwritten, so a build
      # would push an image this node cannot pull. That is the cluster job's
      # ground; this one asks only whether the installer completes.
      #
      # Known limit, stated because a green tick will otherwise be read as more
      # than it is: kind has no LoadBalancer Services, so the preflight that
      # refuses an install over a controller already holding 80 and 443 passes
      # here by finding nothing. The flag runs; the condition it exists for
      # does not. That check was measured on stock k3s instead.
      - name: Install, for real
        run: |
          ./scripts/install.sh \
            --domain demo.example.test \
            --email ci@example.test \
            --tenant acme \
            --skip-k3s --skip-node-config

  # ------------------------------------------------------------- operator
  operator:
    name: Build and test the operator
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Pinned to the tag the reference tenant's chart already runs, so the
      # engine tested here is the engine this project ships against.
      postgres:
        image: postgres:17.2-alpine3.21
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: evidence
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # `make test` regenerates the CRD and deepcopy code before running. If the
      # committed output differs from what the types produce, the tree is
      # inconsistent and every manifest downstream is stale — so it is a failure
      # here rather than a surprise at apply time.
      # The evidence store has two engines and they disagree about statements
      # this repository has to get right in both: BEGIN IMMEDIATE serialises
      # writers on SQLite and does nothing on PostgreSQL, FOR UPDATE parses on
      # one and not the other. The conformance suite skips PostgreSQL when this
      # is unset, which keeps `go test ./...` useful on a laptop — so this
      # service is what stops the skip from becoming permanent.
      - name: Test, and prove the generated code is committed
        env:
          DAMGA_TEST_POSTGRES_DSN: postgres://postgres:test@localhost:5432/evidence?sslmode=disable
        run: |
          make -f Makefile.operator test
          if ! git diff --exit-code -- api config; then
            echo "generated files are out of date — run 'make -f Makefile.operator manifests generate' and commit"
            exit 1
          fi

      - name: Lint
        run: make -f Makefile.operator lint

  # ----------------------------------------------------------- integration
  e2e:
    name: Deploy to a real cluster
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test, manifests]
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.3

      - name: Create kind cluster
        # Both the action and the node image are pinned, and the node image is
        # the reason. `helm/kind-action@v1` is a moving tag whose default node
        # image moves with it, so the Kubernetes version underneath this job
        # could change with no commit in this repository — and a control plane
        # that changes on its own turns a red build into a question nobody can
        # answer from the diff. It cost hours once already: a genuine operator
        # bug was suspected of being version drift, and ruling that out meant
        # digging the node image out of three separate run logs to prove all
        # three had been identical.
        #
        # The kind CLI is pinned for the same reason, and it was not until it
        # broke: the action's own default is v0.31.0, which reads containerd
        # config versions 2 and 3. A v1.36 node image ships version 4, so
        # `kind load docker-image` failed with "unknown containerd config
        # version: 4" before a single assertion ran. That was the tool, not the
        # platform — worth saying, because the run looked like Kubernetes 1.36
        # rejecting this operator and it was the loader refusing to read a file.
        #
        # v1.36.4 rather than v1.36.1 because it is the image kind v0.33.0 ships
        # and tests against; pinning a CLI to a node image it never saw is the
        # same drift this comment exists to prevent, pointed the other way.
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: ci
          config: kind-config.yaml
          version: v0.33.0
          node_image: kindest/node:v1.36.4

      # Applied first, so the release has to satisfy them rather than being
      # grandfathered in — and so the API server has picked the bindings up
      # long before anything is tested against them.
      # kind's config has the kubelets ask the cluster CA for serving
      # certificates; nothing grants them without this, and a kubelet still
      # waiting for one is a difference between CI and `make up`.
      - name: Approve kubelet serving certificates
        run: ./scripts/approve-kubelet-certs.sh

      # The directory rather than a list of files, because the list was wrong
      # once already: the admission policies were deleted and this step went on
      # naming them, which failed here and nowhere else — no local gate stands
      # up a cluster. kubectl reads only .yaml, .yml and .json from a directory,
      # so the README beside them is ignored.
      # The CRDs first, and this is an ordering constraint rather than a
      # preference. The build namespace carries a quota on
      # count/builds.platform.damga.co; a ResourceQuota that counts a type the
      # API server has never heard of cannot compute a usage for it, and until
      # it does, admission refuses every create with "status unknown for quota"
      # — a message about the quota, not about the missing type. The operator
      # installs these much later, so before this step existed the first Build
      # of every run was refused by the platform's own guard rail.
      #
      # The control plane wants them early too: its manager watches Workloads
      # and Databases, and a cache for a type that does not exist starts empty
      # and stays empty.
      - name: Install the CRDs
        run: make -f Makefile.operator install

      - name: Apply the namespace and the tenant fence
        run: kubectl apply -f policies/

      # The zero-downtime check below measures through the ingress controller,
      # the same path a real user takes. `kubectl port-forward` is bound to one
      # pod, so a rollout kills the tunnel and the measurement, not the service.
      # The registry, and the node-side file without which the kubelet answers
      # every pull with "no such host" while the build that produced the image
      # succeeded. kind-config.yaml points containerd at the directory; the file
      # has to be written per node because kind cannot place it.
      - name: Install the image registry and the build namespace
        run: |
          kubectl apply -f cluster/registry.yaml -f cluster/build-namespace.yaml
          kubectl -n damga-registry rollout status deployment/registry --timeout=300s
          for node in $(kind get nodes --name ci); do
            docker exec "$node" mkdir -p "/etc/containerd/certs.d/${REGISTRY_HOST}"
            docker exec -i "$node" tee "/etc/containerd/certs.d/${REGISTRY_HOST}/hosts.toml" >/dev/null <<TOML
          server = "http://${REGISTRY_HOST}"

          [host."http://localhost:30500"]
            capabilities = ["pull", "resolve"]
          TOML
          done

      # Built immediately before it is deployed, and the adjacency is the
      # point: the first version of this sat further down beside the reference
      # tenant's build, so the Deployment referred to an image that was not on
      # any node yet and the pod sat in ErrImageNeverPull until the rollout
      # timed out. imagePullPolicy: Never turns a missing local image into a
      # permanent failure rather than a slow one, which is what makes the
      # ordering load-bearing rather than merely tidy.
      #
      # The control plane had no Dockerfile until 2026-09-01 and was
      # therefore never built by anything. The first attempt failed at once:
      # .dockerignore re-includes only *.go, so the SQL the stores embed and the
      # panel assets were not in the build context. That is the good version of
      # the failure — go:embed reads at compile time and the build stops — but
      # nothing had ever run it.
      - name: Build and load the control plane
        run: |
          docker build -t "damga-control-plane:${IMAGE_TAG}" .
          kind load docker-image "damga-control-plane:${IMAGE_TAG}" --name ci

      # The platform's own control plane, in the cluster it manages. Proves
      # three things a unit test cannot: the image starts under `restricted`,
      # the panel is served from inside the binary, and the ServiceAccount can
      # do exactly what it is meant to and nothing more.
      # Before the control plane, because cluster/control-plane.yaml declares a
      # Role and a RoleBinding in the argocd namespace — the permission that
      # lets the control plane write the Application it delivers. Applying it
      # first fails with `namespaces "argocd" not found`, which is what this run
      # did before this step existed.
      #
      # scripts/install.sh has had this order all along: Argo CD, then the
      # control plane. CI had it backwards, which is the fifth time this
      # repository has paid for one fact living in two places — and the first
      # time the copy that ran was the wrong one, which is why it was caught
      # here rather than by somebody's install.
      - name: Install Argo CD
        run: |
          helm repo add argo https://argoproj.github.io/argo-helm >/dev/null
          helm upgrade --install argocd argo/argo-cd \
            --version "$(grep -A3 'variable "argocd_version"' terraform/variables.tf \
                          | sed -n 's/.*default *= *"\([^"]*\)".*/\1/p')" \
            --namespace argocd --create-namespace \
            --values cluster/argocd-values.yaml --wait --timeout 12m

      - name: Deploy the control plane
        run: |
          kubectl apply -f cluster/control-plane.yaml
          kubectl -n damga-system set image deployment/damga \
            damga="damga-control-plane:${IMAGE_TAG}"
          kubectl -n damga-system patch deployment damga --type=json \
            -p '[{"op":"replace","path":"/spec/template/spec/containers/0/imagePullPolicy","value":"Never"}]'
          # Diagnostics on the failure rather than after it. A rollout that
          # times out says "0 of 1 updated replicas are available" and nothing
          # else — true of a pod that will not schedule, will not pull, will not
          # start and will not pass a probe, which are four different problems
          # with four different fixes. This session has already lost four CI
          # rounds to messages that named the symptom and not the cause.
          kubectl -n damga-system rollout status deployment/damga --timeout=300s || {
            echo "::group::why the control plane did not start"
            kubectl -n damga-system get pod,pvc -o wide
            kubectl -n damga-system describe pod -l app.kubernetes.io/name=damga | tail -40
            echo "--- logs (the container may never have run) ---"
            kubectl -n damga-system logs -l app.kubernetes.io/name=damga --tail=60 --all-containers || true
            kubectl -n damga-system logs -l app.kubernetes.io/name=damga --previous --tail=60 || true
            echo "--- events, newest last ---"
            kubectl -n damga-system get events --sort-by=.lastTimestamp | tail -25
            echo "::endgroup::"
            exit 1
          }

      - name: The control plane serves its own panel
        run: |
          # Two requests reported separately, and the body printed whatever
          # happens. The first version of this ran `curl -sf /healthz && curl
          # -sf /` and said "the panel was not served" for every outcome: a
          # service with no endpoints, a 500 from the panel handler, an empty
          # body, and a probe pod whose output never got attached all produced
          # that one sentence. It named the symptom, which is the failure this
          # repository keeps paying a round for.
          # Created, waited for, then read with `logs` — not `run --rm -i`.
          #
          # The -i form attaches to the pod's stream as it starts, and when the
          # attach loses that race it returns nothing at all: no status codes,
          # no body, exit 0. This step failed that way twice today and the first
          # time it was called a flake and rerun, because the message then was
          # "the panel was not served" and that sentence is true of an empty
          # capture as well as of a broken control plane. The diagnostics added
          # in between are what told the two apart — the failure printed a
          # deployment that was healthy and a probe that had said nothing.
          #
          # A pod that runs to completion and is then read cannot lose that
          # race: the output exists in the container log whether or not anyone
          # was attached when it was written.
          kubectl -n damga-system run cp-probe --restart=Never \
            --image=curlimages/curl:8.11.1 \
            --overrides='{"spec":{"securityContext":{"runAsNonRoot":true,"runAsUser":1000,"seccompProfile":{"type":"RuntimeDefault"}},"containers":[{"name":"cp-probe","image":"curlimages/curl:8.11.1","command":["sh","-c","echo healthz=$(curl -s -o /dev/null -w %{http_code} --max-time 10 http://damga/healthz); echo panel=$(curl -s -o /dev/null -w %{http_code} --max-time 10 http://damga/); echo body:; curl -s --max-time 10 http://damga/ | head -c 200"],"securityContext":{"allowPrivilegeEscalation":false,"readOnlyRootFilesystem":true,"capabilities":{"drop":["ALL"]}},"resources":{"requests":{"cpu":"10m","memory":"32Mi"},"limits":{"memory":"64Mi"}}}]}}'
          kubectl -n damga-system wait --for=jsonpath='{.status.phase}'=Succeeded \
            pod/cp-probe --timeout=120s || true
          kubectl -n damga-system logs cp-probe > /tmp/cp.out 2>&1 || true
          kubectl -n damga-system delete pod cp-probe --ignore-not-found --wait=false
          cat /tmp/cp.out
          grep -q '<!doctype html>' /tmp/cp.out || {
            echo "::group::the panel did not answer with HTML"
            echo "what the probe saw:"; cat /tmp/cp.out
            echo "-- healthz= and panel= above are HTTP status codes; no line at"
            echo "-- all means the probe pod produced no output, which is a"
            echo "-- different failure from a bad status."
            kubectl -n damga-system get deploy,rs,pod,svc,endpoints -o wide || true
            kubectl -n damga-system logs -l app.kubernetes.io/name=damga \
              --tail=80 --all-containers --prefix || true
            kubectl -n damga-system get events --sort-by=.lastTimestamp | tail -20 || true
            echo "::endgroup::"
            exit 1
          }


      - name: Install ingress-nginx
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.13.0/deploy/static/provider/baremetal/deploy.yaml

          # Existence first, then the condition. `kubectl wait --for=condition`
          # against a selector matching nothing answers "no matching resources
          # found" immediately and spends none of its --timeout, so this line
          # has never been protected by the 300s beside it. It has stayed green
          # because kind creates the pod inside the same second — measured on
          # k3s, the same wait needed 2s to find the pod and 124s for it to be
          # ready, and the 2s were the entire bug.
          #
          # Third instance of this shape in this file. The other two were fixed
          # earlier today, and this one was found by reading rather than by
          # going red, which is what a fast cluster buys you until it does not.
          started=$(date +%s)
          for _ in $(seq 1 60); do
            kubectl -n ingress-nginx get pod -l app.kubernetes.io/component=controller \
              -o name 2>/dev/null | grep -q . && break
            sleep 1
          done
          echo "the controller pod existed after $(($(date +%s)-started))s"
          kubectl wait -n ingress-nginx --for=condition=Ready pod \
            -l app.kubernetes.io/component=controller --timeout=300s
          echo "it was ready after $(($(date +%s)-started))s"
          # Both ports, matching the two mappings in kind-config.yaml. Pinning
          # only HTTP leaves 8443 pointing at nothing, which is a confusing way
          # to fail: the certificate is issued, the listener is up, and the
          # connection simply never arrives.
          kubectl patch svc ingress-nginx-controller -n ingress-nginx --type=json \
            -p='[{"op":"replace","path":"/spec/ports/0/nodePort","value":30080},{"op":"replace","path":"/spec/ports/1/nodePort","value":30443}]'

      - name: Build and load the image
        run: |
          docker build -t "damga-app:${IMAGE_TAG}" ./app
          kind load docker-image "damga-app:${IMAGE_TAG}" --name ci


      - name: Install the chart
        run: |
          helm upgrade --install app ./chart \
            --namespace damga \
            --set image.tag="${IMAGE_TAG}" \
            --set postgres.auth.password=ci-password \
            --set networkPolicy.enabled=true \
            --timeout 10m
          kubectl -n damga rollout status deployment/app-redis --timeout=300s
          kubectl -n damga rollout status statefulset/app-postgres --timeout=300s
          kubectl -n damga rollout status deployment/app-damga-app --timeout=300s

      # Straight after an install the database is empty, so the assertion here
      # is only that a schema came back. The one that matters runs after the
      # upgrade below, once the smoke test has written to it.
      - name: The backup restored a schema
        run: MIN_ROWS=0 ./scripts/restore-check.sh

      - name: The shared limit must bind across replicas
        run: |
          # With per-replica counters, N replicas give a client N times its
          # allowance. This is the regression test for that.
          kubectl -n damga set env deployment/app-damga-app READS_PER_MINUTE=30
          kubectl -n damga rollout status deployment/app-damga-app --timeout=300s
          kubectl -n damga port-forward svc/app-damga-app 18080:80 &
          sleep 5
          jar=$(mktemp); curl -sf -c "$jar" -o /dev/null http://127.0.0.1:18080/stats
          allowed=0
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -b "$jar" http://127.0.0.1:18080/stats)
            [ "$code" = "200" ] && allowed=$((allowed+1))
            sleep 0.12
          done
          echo "allowed $allowed of 60 against a limit of 30"
          # Shared: about 30. Per replica: all 60 would pass.
          [ "$allowed" -le 35 ]
          kill %1 || true
          kubectl -n damga set env deployment/app-damga-app READS_PER_MINUTE-
          kubectl -n damga rollout status deployment/app-damga-app --timeout=300s

      # TLS is exercised, not just prepared. The only difference from a public
      # deployment is who signed the certificate: the Certificate resource, the
      # secret, the nginx TLS listener, the redirect and the Secure cookie are
      # the same objects doing the same work.
      - name: Issue a certificate and serve HTTPS
        run: |
          kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.16.2/cert-manager.yaml
          kubectl wait -n cert-manager --for=condition=Available deployment --all --timeout=300s
          kubectl apply -f cluster/issuers.yaml
          kubectl wait --for=condition=Ready clusterissuer/selfsigned-ca --timeout=120s

          helm upgrade app ./chart -n damga \
            --set image.tag="${IMAGE_TAG}" \
            --set postgres.auth.password=ci-password \
            --set ingress.tls.enabled=true \
            --set ingress.tls.clusterIssuer=selfsigned-ca \
            --set config.SECURE_COOKIE=true --timeout 10m
          kubectl -n damga wait --for=condition=Ready certificate/damga-app-tls --timeout=180s
          kubectl -n damga rollout status deployment/app-damga-app --timeout=300s

      - name: HTTPS, the redirect and the Secure cookie must all work
        run: |
          kubectl get svc -n ingress-nginx ingress-nginx-controller \
            -o jsonpath='{range .spec.ports[*]}{.name}={.nodePort} {end}{"\n"}'
          for _ in $(seq 1 30); do
            curl -sk -o /dev/null https://localhost:8443/healthz -H 'Host: app.local' && break || sleep 2
          done

          # served over TLS
          curl -sk -H 'Host: app.local' https://localhost:8443/healthz | grep -q ok
          echo "tls: ok"

          # the certificate is the one cert-manager issued
          echo | openssl s_client -connect localhost:8443 -servername app.local 2>/dev/null \
            | openssl x509 -noout -issuer | grep -q 'damga local CA'
          echo "issuer: ok"

          # plain HTTP is redirected, not served
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: app.local' http://localhost:8080/healthz)
          echo "http -> $code"; [ "$code" = "308" ]

          # The visitor cookie must be marked Secure. Retried, because the
          # release that turned it on has just rolled: the preStop delay keeps
          # replaced pods in the endpoint list for a few more seconds, and one
          # of them still answers with the old configuration. That window is
          # the feature working, not a flake to paper over — so the check waits
          # it out rather than asserting once and hoping.
          for attempt in $(seq 1 20); do
            headers=$(curl -sk -D - -o /dev/null -H 'Host: app.local' https://localhost:8443/stats)
            if grep -i 'set-cookie' <<<"$headers" | grep -q 'Secure'; then
              echo "secure cookie: ok (attempt $attempt)"
              exit 0
            fi
            sleep 2
          done
          echo "the visitor cookie never came back marked Secure. Last headers:"
          echo "$headers"
          kubectl -n damga get pods -l app.kubernetes.io/name=damga-app \
            -o custom-columns=NAME:.metadata.name,AGE:.metadata.creationTimestamp
          exit 1

      - name: Back to plain HTTP for the remaining checks
        run: |
          helm upgrade app ./chart -n damga \
            --set image.tag="${IMAGE_TAG}" \
            --set postgres.auth.password=ci-password --timeout 10m
          kubectl -n damga rollout status deployment/app-damga-app --timeout=300s

      - name: Ingress must route to the service
        run: |
          for _ in $(seq 1 30); do
            curl -sf -H 'Host: app.local' http://localhost:8080/healthz && break || sleep 2
          done
          curl -sf -H 'Host: app.local' http://localhost:8080/stats | grep -q servedBy
          # The scrape endpoint listens on another port, so routing the whole
          # host to the service must still not expose it.
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: app.local' http://localhost:8080/metrics)
          echo "GET /metrics -> $code"
          [ "$code" = "404" ]

      - name: Smoke test
        run: ./scripts/smoke-test.sh

      - name: Upgrade must be zero-downtime
        run: |
          # Record every outcome, not just failures, so the totals are meaningful.
          ( for _ in $(seq 1 200); do
              if curl -sf -m 3 -H 'Host: app.local' http://localhost:8080/healthz >/dev/null
              then echo OK; else echo DOWN; fi
              sleep 0.2
            done > /tmp/rollout.log ) &
          LOOP=$!
          helm upgrade app ./chart -n damga \
            --set image.tag="${IMAGE_TAG}" \
            --set postgres.auth.password=ci-password \
            --set config.GREETING=Upgraded --timeout 10m
          kubectl -n damga rollout status deployment/app-damga-app --timeout=300s
          wait $LOOP
          TOTAL=$(wc -l < /tmp/rollout.log)
          FAILED=$(grep -c DOWN /tmp/rollout.log || true)
          echo "requests through ingress: $TOTAL, failed: $FAILED"
          [ "$FAILED" -eq 0 ]

      # The control plane's own upgrade, and the honest version of the claim.
      #
      # The step above proves a tenant application rolls without dropping a
      # request. This one does not claim the same about the control plane, and
      # the reason is in cluster/control-plane.yaml: one replica, strategy
      # Recreate, because the default DSN is SQLite on a ReadWriteOnce claim and
      # two pods cannot both hold it. Recreate means the old pod is gone before
      # the new one starts, so there is a gap by construction. It is measured
      # and printed rather than asserted at zero — an assertion that has to pass
      # against a known gap is either always red or written loosely enough to
      # pass for the wrong reason, and this repository has paid for the second
      # kind.
      #
      # What IS asserted is what an upgrade must not do to the person using the
      # platform: disturb what is already deployed. That is not free of content
      # just because the control plane is not in a tenant's request path —
      # scripts/upgrade.sh re-applies config/crd/bases, and a change to a type
      # reaches every Workload in the cluster through the operator. That is the
      # path this step fails on.
      - name: Upgrading the control plane must not disturb what is deployed
        run: |
          # A second tag on the image already loaded into the node. The bytes
          # are identical on purpose: what is under test is the rollout, the
          # volume it re-attaches and the applications beside it, not a code
          # change. It costs no rebuild and still produces a real new
          # ReplicaSet, because the pod template changed.
          docker tag "damga-control-plane:${IMAGE_TAG}" damga-control-plane:upgrade-test
          kind load docker-image damga-control-plane:upgrade-test --name ci

          # An owner, so the upgrade has something to lose — and one whose
          # password later steps can use, because bootstrap runs once per
          # install and the notification step below needs to reach the API as
          # somebody.
          #
          # A literal password in a workflow file, which is safe here and
          # nowhere else: this cluster is created by this job, is reachable from
          # nothing outside the runner, and is deleted with it. The alternative
          # is worse — bootstrap prints a generated password to stdout, and
          # capturing it means putting a credential in the job log. There is no
          # -password flag for the same reason; -password-stdin is the only way
          # in.
          printf '%s' "$CI_OWNER_PASSWORD" | kubectl -n damga-system exec -i deploy/damga -- \
            /damga bootstrap -evidence-dsn /data/damga.db \
            -email owner@example.test -tenant acme -password-stdin > /dev/null

          # Two pollers. The tenant is measured through the ingress, the same
          # path a user takes; the control plane is measured through its ready
          # endpoints, which is what kube-proxy routes to and therefore what a
          # caller experiences. Endpoints rather than a port-forward, because a
          # port-forward binds to one pod and a Recreate kills the tunnel — the
          # measurement would end exactly when it got interesting.
          ( for _ in $(seq 1 200); do
              if curl -sf -m 3 -H 'Host: app.local' http://localhost:8080/healthz >/dev/null
              then echo OK; else echo DOWN; fi
              sleep 0.2
            done > /tmp/tenant.log ) &
          TENANT=$!
          ( for _ in $(seq 1 200); do
              if [ -n "$(kubectl -n damga-system get endpoints damga \
                           -o jsonpath='{.subsets[*].addresses[*].ip}' 2>/dev/null)" ]
              then echo "$(date +%s) UP"; else echo "$(date +%s) GAP"; fi
            done > /tmp/cp.log ) &
          CP=$!

          # Redirected rather than piped through tee. This workflow sets no
          # shell defaults, so a `run:` block is `bash -e` without pipefail —
          # and `upgrade.sh | tee` would report tee's status, turning a failed
          # upgrade into a passing step.
          rc=0
          ./scripts/upgrade.sh --image damga-control-plane:upgrade-test \
            > /tmp/upgrade.out 2>&1 || rc=$?
          cat /tmp/upgrade.out
          wait $TENANT
          wait $CP
          [ "$rc" -eq 0 ] || { echo "upgrade.sh exited $rc"; exit "$rc"; }

          TOTAL=$(wc -l < /tmp/tenant.log)
          FAILED=$(grep -c DOWN /tmp/tenant.log || true)
          echo "tenant requests through ingress during the upgrade: $TOTAL, failed: $FAILED"

          SAMPLES=$(wc -l < /tmp/cp.log)
          GAPS=$(grep -c ' GAP$' /tmp/cp.log || true)
          if [ "$GAPS" -gt 0 ]; then
            first=$(grep ' GAP$' /tmp/cp.log | head -1 | cut -d' ' -f1)
            last=$(grep ' GAP$' /tmp/cp.log | tail -1 | cut -d' ' -f1)
            # A lower bound: the timestamps have one-second resolution and the
            # gap is bounded by samples taken outside it.
            echo "control plane had no ready endpoint for >= $((last - first))s ($GAPS of $SAMPLES samples)"
          else
            echo "control plane never lost its endpoint across $SAMPLES samples"
          fi

          # An upgrade that changed nothing would pass every assertion below by
          # never having rolled. upgrade.sh says so in those words, and this is
          # the line that stops the step from proving the absence of an event.
          if grep -q 'nothing moved' /tmp/upgrade.out; then
            echo "the upgrade did not move the control plane, so nothing above was tested"
            exit 1
          fi

          # The claim is the install: accounts, sessions, placements and every
          # deploy record are one SQLite file on it. upgrade.sh refuses when it
          # is replaced; this asserts the deployment came back on it.
          kubectl -n damga-system get pvc damga-data \
            -o jsonpath='{.status.phase}' | grep -q Bound

          # And the file on it still has the owner in it. Bootstrap exits 3 for
          # "this install already has an owner", which is the whole assertion:
          # an upgrade that came back on an empty database would exit 0 here and
          # look like a success, and every symptom of that arrives later as
          # "my accounts are gone".
          rc=0
          kubectl -n damga-system exec deploy/damga -- \
            /damga bootstrap -evidence-dsn /data/damga.db \
            -email owner@example.test -tenant acme > /dev/null 2>&1 || rc=$?
          [ "$rc" -eq 3 ] || {
            echo "after the upgrade the control plane no longer knows its owner (bootstrap exited $rc, want 3)"
            exit 1
          }

          [ -n "$(kubectl -n damga-system get endpoints damga \
                    -o jsonpath='{.subsets[*].addresses[*].ip}')" ]
          [ "$FAILED" -eq 0 ]

      # The rehearsal reran as a post-upgrade hook, and by now the smoke test has
      # written notes. This is the assertion the whole feature exists for: rows
      # that were in the database came back out of the archive. A dump truncated
      # after the schema passes gzip -t, restores cleanly, produces tables, and
      # fails here.
      - name: The backup restored the rows as well as the schema
        run: MIN_ROWS=1 ./scripts/restore-check.sh

      # The operator is exercised in the same namespace the rest of this job
      # uses, which is where Pod Security Admission and the admission policies
      # are enforced. That is the assertion worth having: the platform's own
      # output has to satisfy the platform's own rules, with nothing exempted.
      - name: Deploy the operator
        run: |
          docker build -f Dockerfile.operator -t "damga-operator:${IMAGE_TAG}" .
          kind load docker-image "damga-operator:${IMAGE_TAG}" --name ci
          make -f Makefile.operator install
          make -f Makefile.operator deploy IMG="damga-operator:${IMAGE_TAG}"
          kubectl -n damga-platform-system rollout status \
            deployment/damga-platform-controller-manager --timeout=180s

      # After the operator, because the CRDs have to exist first. `kubectl auth
      # can-i` resolves `builds.platform.damga.co` through discovery before it
      # asks RBAC anything, so with the type unregistered the answer is "no" for
      # a reason that has nothing to do with the Role — which is what the first
      # run of this said, and it read as a broken RoleBinding.
      - name: The control plane's identity is scoped
        run: |
          sa=system:serviceaccount:damga-system:damga
          check() { # verb resource namespace want
            got=$(kubectl auth can-i "$1" "$2" -n "$3" --as="$sa" 2>&1 || true)
            [ "$got" = "$4" ] || {
              echo "can-i $1 $2 -n $3 = '$got', want '$4'"
              return 1
            }
          }
          # An over-broad Role looks identical to a correct one until something
          # uses it, so both directions are asserted.
          check create builds.platform.damga.co damga-build yes \
            || { echo "the build endpoint would stay 501"; exit 1; }
          check delete builds.platform.damga.co damga-build no \
            || { echo "deleting a Build removes the record of what is running"; exit 1; }
          check create workloads.platform.damga.co damga no \
            || { echo "the control plane could write into a tenant; the write path is git"; exit 1; }
          check get workloads.platform.damga.co damga yes \
            || { echo "the backup endpoint cannot read what it reports on"; exit 1; }
          check get pods/log damga yes \
            || { echo "the log endpoint cannot read what it streams"; exit 1; }
          # Reading a log is not a licence to enter the container.
          check create pods/exec damga no \
            || { echo "the control plane can exec into a tenant's pod"; exit 1; }

      - name: A Workload must reach Ready
        run: |
          # Unquoted delimiter on purpose: ${IMAGE_TAG} has to expand. With
          # <<'EOF' it reached the API server as a literal and the pods came up
          # InvalidImageName, which the wait below then reported only as a
          # timeout.
          cat <<EOF | kubectl apply -f -
          apiVersion: platform.damga.co/v1alpha1
          kind: Workload
          metadata:
            name: ci-probe
            namespace: damga
          spec:
            image: damga-app:${IMAGE_TAG}
            port: 3000
            replicas: 2
          EOF
          if ! kubectl -n damga wait --for=condition=Ready workload/ci-probe --timeout=180s; then
            kubectl -n damga get workload ci-probe -o jsonpath='{.status.conditions}' | tr ',' '\n'
            # READY and RESTARTS, not just phase. A container that is Running
            # and a container that is Ready are different claims, and the first
            # time this timed out only the weaker one was printed — which sent
            # the search after the readiness probe when the probe was passing.
            kubectl -n damga get pod -l app.kubernetes.io/instance=ci-probe \
              -o custom-columns=NAME:.metadata.name,PHASE:.status.phase,READY:.status.containerStatuses[0].ready,RESTARTS:.status.containerStatuses[0].restartCount,IMAGE:.spec.containers[0].image,REASON:.status.containerStatuses[0].state.waiting.reason
            # All three levels, because they can disagree, and which pair
            # disagrees says which controller is at fault.
            kubectl -n damga get deployment,replicaset -l app.kubernetes.io/instance=ci-probe -o wide
            exit 1
          fi

      # The observability half of "could I run this instead of Coolify": the
      # user seeing whether their own application is healthy.
      #
      # It runs twice on purpose, either side of installing metrics-server,
      # because this endpoint has two honest answers and only one of them is
      # ever exercised by a unit test with a fake in it. Without metrics-server
      # the pod facts still have to arrive and the response has to name the
      # component it is missing; with it, the numbers have to appear. An
      # endpoint that answered the same both ways would be reporting an app
      # that uses no memory.
      - name: An app's own metrics must answer, and name what they cannot
        run: |
          set -euo pipefail
          # The owner this install already has. This step first bootstrapped
          # its own, and that is why it failed: bootstrap runs once per install
          # and answers `this install already has an owner` with exit 3 to say
          # so — the same 3 the upgrade step asserts as proof the database
          # survived. Under `set -e` a correct refusal killed the step.
          #
          # So it logs in as the owner made further up, whose password is in
          # CI_OWNER_PASSWORD precisely so later steps do not each make one.

          kubectl -n damga-system port-forward svc/damga 18080:80 >/dev/null 2>&1 &
          forward=$!
          trap 'kill "$forward" 2>/dev/null || true' EXIT
          # The sleep is the fix, and its absence is why this step failed once
          # in 0.1 seconds: a refused connection returns immediately, so thirty
          # attempts with nothing between them are thirty attempts in the same
          # millisecond, and --max-time never applies because there is nothing
          # to time out against. It passed on every earlier run by winning a
          # race it was not waiting for.
          started=$(date +%s)
          for i in $(seq 1 30); do
            curl -sf --max-time 2 http://127.0.0.1:18080/healthz >/dev/null && break
            [ "$i" = 30 ] && {
              echo "the port-forward never answered /healthz in $(($(date +%s)-started))s"
              kubectl -n damga-system get pod,endpoints -l app.kubernetes.io/name=damga || true
              jobs -l || true
              exit 1
            }
            sleep 1
          done
          echo "the port-forward answered after $(($(date +%s)-started))s"

          api() { curl -s -b /tmp/jar -c /tmp/jar "$@"; }
          api -X POST -H 'Content-Type: application/json' \
            -d "{\"email\":\"owner@example.test\",\"password\":\"$CI_OWNER_PASSWORD\"}" \
            http://127.0.0.1:18080/api/v1/login -o /dev/null -w 'login=%{http_code}\n' | grep -q 'login=200' \
            || { echo "the owner this install was bootstrapped with cannot log in"; exit 1; }
          # The path takes the tenant id and not the slug, which is the one
          # thing about this API a reader gets wrong first. Read from /me
          # rather than from bootstrap's output, because this step no longer
          # runs bootstrap.
          tenant=$(api http://127.0.0.1:18080/api/v1/me | jq -r '.memberships[0].tenantId')
          [ -n "$tenant" ] && [ "$tenant" != null ] || { echo "/me named no tenant"; exit 1; }
          # ci-probe is the Workload the step above left Ready. The placement is
          # what turns its name into a namespace; without one this endpoint
          # answers 404 and is right to.
          api -X POST -H 'Content-Type: application/json' \
            -d '{"app":"ci-probe","env":"prod","repoUrl":"https://example.test/ci","branch":"main","path":"apps/ci-probe/prod","namespace":"damga"}' \
            "http://127.0.0.1:18080/api/v1/tenants/$tenant/apps" -o /dev/null -w 'createApp=%{http_code}\n' \
            | grep -q 'createApp=201' || { echo "could not register ci-probe"; exit 1; }

          metrics="http://127.0.0.1:18080/api/v1/tenants/$tenant/apps/ci-probe/envs/prod/metrics"

          # Written to a file and given the answer as an argument. A heredoc
          # and a stdin redirect on one command do not compose: the redirect
          # wins and python reads the JSON as its own source, which fails with
          # "name 'true' is not defined" and looks like a broken response.
          cat > /tmp/check-before.py <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          pods = d.get("pods") or []
          if len(pods) != 2:
              sys.exit(f"pods = {len(pods)}, want the two replicas ci-probe runs: {d}")
          if any(p.get("phase") != "Running" for p in pods):
              sys.exit(f"a replica is not Running: {pods}")
          # The facts that need nothing but the API server have to be here.
          if any("restarts" not in p for p in pods):
              sys.exit(f"a replica reports no restart count: {pods}")
          note = d.get("usage", {}).get("note", "")
          if "metrics-server" not in note:
              sys.exit(f"usage.note = {note!r}, want it to name the component that is absent")
          if any(p["cpu"].get("usage") for p in pods):
              sys.exit(f"usage appeared with no metrics-server installed: {pods}")
          # And the requests the Workload asked for, which is what makes a
          # usage figure mean anything once there is one.
          if not all(p["memory"].get("limit") for p in pods):
              sys.exit(f"no memory limit reported: {pods}")
          print("without metrics-server: pod facts present, usage named as missing")
          PY
          # First answer: no metrics-server in this cluster.
          api "$metrics" > /tmp/metrics-before.json
          python3 /tmp/check-before.py /tmp/metrics-before.json

          # Second answer: with it. The repository's own values, which do not
          # turn TLS verification off — the kubelet serving certificates this
          # job approved earlier are what make that possible.
          helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server/ >/dev/null
          start=$(date +%s)
          helm upgrade --install metrics-server metrics-server/metrics-server \
            -n kube-system -f cluster/metrics-server-values.yaml --wait --timeout 5m >/dev/null
          echo "metrics-server ready in $(($(date +%s)-start))s"

          # Ready is not the same as having a sample, and this step learned the
          # difference the hard way: metrics-server reported Ready in 25s and
          # metrics.k8s.io answered "not answering in this cluster" a moment
          # later, because a scrape has to happen before there is anything to
          # serve. The session that wrote this measured Ready locally and found
          # data waiting; on a slower runner the two came apart.
          #
          # Polled rather than slept, so the wait is as long as it needs to be
          # and the number below says what it actually took.
          start=$(date +%s)
          for _ in $(seq 1 60); do
            kubectl top pods -n damga --no-headers >/dev/null 2>&1 && break
            sleep 2
          done
          kubectl top pods -n damga --no-headers >/dev/null 2>&1 \
            || { echo "metrics.k8s.io never served a sample; kubectl top says:";
                 kubectl top pods -n damga 2>&1 | head -5;
                 kubectl -n kube-system logs deploy/metrics-server --tail=30 || true;
                 exit 1; }
          echo "metrics.k8s.io served its first sample $(($(date +%s)-start))s after Ready"

          cat > /tmp/check-after.py <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          src = d.get("usage", {}).get("source")
          if src != "metrics.k8s.io":
              sys.exit(f"usage.source = {src!r} with metrics-server installed: {d.get('usage')}")
          pods = d.get("pods") or []
          measured = [p for p in pods if p["cpu"].get("usage") and p["memory"].get("usage")]
          if not measured:
              # A crash-looping pod is never scraped, and the endpoint says so
              # rather than reporting zero. Either answer is correct; silence
              # is not.
              note = d.get("usage", {}).get("note", "")
              if "no sample" not in note:
                  sys.exit(f"no pod carries usage and nothing says why: {d}")
              print("with metrics-server: answered, and no sample yet for these pods")
          else:
              p = measured[0]
              # Nanocores are what metrics.k8s.io reports and nobody reads.
              if p["cpu"]["usage"].endswith("n"):
                  sys.exit(f"cpu usage {p['cpu']['usage']} is in nanocores; kubectl top says milli")
              print(f"with metrics-server: cpu={p['cpu']['usage']} memory={p['memory']['usage']} "
                    f"of limit {p['memory'].get('limit')} ({p['memory'].get('ofLimitPercent')}%)")
          PY
          api "$metrics" > /tmp/metrics-after.json
          python3 /tmp/check-after.py /tmp/metrics-after.json

          # metrics-server is removed again, so the steps after this one see the
          # cluster they were written against. Nothing here asserts on the HPA,
          # and an autoscaler that suddenly has metrics is a change to somebody
          # else's step rather than to this one.
          #
          # ci-probe is NOT removed, and this line used to remove it. The
          # sentence above was right and the action under it was backwards: the
          # steps after this one were written against a cluster where ci-probe
          # exists. Two of them read it — the hardening check reads its pod, and
          # the deletion check deletes it and asserts on what is left. That last
          # one is where it surfaced, with `workloads.platform.damga.co
          # "ci-probe" not found`, one step after the one that reads its pod
          # passed only because the pod was still terminating.
          #
          # This step borrows ci-probe; it does not own it. What it creates is a
          # placement, and there is no Argo CD here to turn that into anything.
          helm uninstall metrics-server -n kube-system >/dev/null

      # Running a command in a container, which is the one endpoint no unit
      # test can reach: the fake Execer in server/exec_internal_test.go proves
      # the five refusals and the exit-code handling, and proves nothing about
      # whether the ClusterRole may exec or whether the SPDY stream survives
      # the API server. Both of those are only true or false against a cluster.
      #
      # NOT placed immediately after "A Workload must reach Ready", which is
      # where it was asked for, and the reason is measured rather than
      # preferred: this endpoint needs a placement row, and the placement for
      # ci-probe is created by the metrics step below with `createApp=201`
      # asserted exactly. Registering ci-probe any earlier makes that step's
      # POST answer 409 and fail. So it goes after the step that already
      # created what it needs.
      # The commands below assume a shell and coreutils, which ci-probe has
      # because app/Dockerfile's runtime stage is node:<version>, a Debian
      # image. If that ever becomes distroless these turn into "executable file
      # not found", which is the platform's own /damga bug pointed at the test
      # — so the failure would be real but would name the wrong thing.
      - name: A command must run in a container, and its exit code must survive
        run: |
          set -euo pipefail
          kubectl -n damga-system port-forward svc/damga 18080:80 >/dev/null 2>&1 &
          forward=$!
          trap 'kill "$forward" 2>/dev/null || true' EXIT
          started=$(date +%s)
          for i in $(seq 1 30); do
            curl -sf --max-time 2 http://127.0.0.1:18080/healthz >/dev/null && break
            [ "$i" = 30 ] && { echo "the port-forward never answered in $(($(date +%s)-started))s"; exit 1; }
            sleep 1
          done

          api() { curl -s -b /tmp/execjar -c /tmp/execjar "$@"; }
          api -X POST -H 'Content-Type: application/json' \
            -d "{\"email\":\"owner@example.test\",\"password\":\"$CI_OWNER_PASSWORD\"}" \
            http://127.0.0.1:18080/api/v1/login -o /dev/null -w 'login=%{http_code}\n' \
            | grep -q 'login=200' || { echo "the owner cannot log in"; exit 1; }
          tenant=$(api http://127.0.0.1:18080/api/v1/me | jq -r '.memberships[0].tenantId')
          exec_url="http://127.0.0.1:18080/api/v1/tenants/$tenant/apps/ci-probe/envs/prod/exec"

          # 1. It runs at all. This is the assertion that covers the RBAC: with
          # pods/exec absent the stream carries an error frame naming the grant
          # instead of the output, and the platform reads as broken to the one
          # person who could fix it.
          api -X POST -H 'Content-Type: application/json' \
            -d '{"command":["echo","damga-exec-works"]}' "$exec_url" > /tmp/exec-ok.sse
          grep -q 'damga-exec-works' /tmp/exec-ok.sse || {
            echo "the command produced no output. The whole stream:"; cat /tmp/exec-ok.sse
            echo "--- if this names pods/exec, the ClusterRole in cluster/control-plane.yaml lost the grant"
            exit 1
          }
          grep -q '"code":0' /tmp/exec-ok.sse || {
            echo "a command that succeeded did not report exit 0:"; cat /tmp/exec-ok.sse; exit 1
          }

          # 2. A non-zero exit is a result and not a failure. This is the
          # distinction the endpoint carries in a separate field and the panel
          # draws as a separate screen, and it is worth one line here because
          # every simpler implementation of exec loses it: a migration that
          # exits 1 ran, and reporting it as a transport failure loses both the
          # code and what it printed.
          api -X POST -H 'Content-Type: application/json' \
            -d '{"command":["sh","-c","echo to-stderr >&2; exit 3"]}' "$exec_url" > /tmp/exec-3.sse
          grep -q '"code":3' /tmp/exec-3.sse || {
            echo "exit 3 did not survive as a code:"; cat /tmp/exec-3.sse; exit 1
          }
          grep -q 'event: error' /tmp/exec-3.sse && {
            echo "a command that exited 3 was reported as an error; it ran:"; cat /tmp/exec-3.sse; exit 1
          }
          grep -q 'to-stderr' /tmp/exec-3.sse || {
            echo "stderr never reached the stream:"; cat /tmp/exec-3.sse; exit 1
          }

          # 3. A container that does not exist is refused by name, rather than
          # by whatever the kubelet says about it.
          api -X POST -H 'Content-Type: application/json' \
            -d '{"command":["true"],"container":"nope"}' "$exec_url" > /tmp/exec-bad.sse
          grep -q 'no such container' /tmp/exec-bad.sse || {
            echo "a missing container was not refused by name:"; cat /tmp/exec-bad.sse; exit 1
          }

      # Reading the rendered pod back rather than the operator's own source. The
      # unit tests already prove the renderer intends this; this proves the API
      - name: The rendered pod must actually carry the hardening
        run: |
          pod=$(kubectl -n damga get pod -l app.kubernetes.io/instance=ci-probe \
                  -o jsonpath='{.items[0].metadata.name}')
          get() { kubectl -n damga get pod "$pod" -o jsonpath="$1"; }
          [ "$(get '{.spec.securityContext.runAsNonRoot}')" = true ] || { echo "runs as root"; exit 1; }
          [ "$(get '{.spec.automountServiceAccountToken}')" = false ] || { echo "carries a token"; exit 1; }
          [ "$(get '{.spec.containers[0].securityContext.readOnlyRootFilesystem}')" = true ] || { echo "writable rootfs"; exit 1; }
          [ "$(get '{.spec.containers[0].securityContext.capabilities.drop[0]}')" = ALL ] || { echo "capabilities kept"; exit 1; }
          [ "$(kubectl -n damga exec "$pod" -- id -u)" != 0 ] || { echo "effective uid is 0"; exit 1; }
          echo "the operator's output satisfies the cluster's own policies"

      # The one thing envtest cannot answer about volumes. It has an API
      # server and no scheduler, so a claim binds nowhere and a pod never runs
      # — and the failure this guards against is precisely a pod that will not
      # start: ReadWriteOnce plus a rolling update deadlocks, the new pod waits
      # for a volume the old one holds, and the old one keeps serving while the
      # deploy fails. Recreate is the fix and this is where it is proved.
      - name: A Workload with a volume must bind it and roll
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: platform.damga.co/v1alpha1
          kind: Workload
          metadata:
            name: ci-stateful
            namespace: damga
          spec:
            image: damga-app:${IMAGE_TAG}
            port: 3000
            volumes:
              - name: data
                path: /var/lib/app
                size: 128Mi
          EOF
          if ! kubectl -n damga wait --for=condition=Ready workload/ci-stateful --timeout=180s; then
            kubectl -n damga get pvc,pod -l app.kubernetes.io/instance=ci-stateful -o wide
            kubectl -n damga describe pvc ci-stateful-data | tail -20
            exit 1
          fi
          [ "$(kubectl -n damga get deploy ci-stateful -o jsonpath='{.spec.strategy.type}')" = Recreate ] \
            || { echo "a workload with a volume is still rolling"; exit 1; }
          [ "$(kubectl -n damga get pvc ci-stateful-data -o jsonpath='{.status.phase}')" = Bound ] \
            || { echo "the claim never bound"; exit 1; }

          # A second rollout over the same claim. The deadlock this guards
          # against only appears on the *update*, so creating it once proves
          # nothing about it.
          kubectl -n damga patch workload ci-stateful --type=merge \
            -p '{"spec":{"env":[{"name":"ROLLED","value":"1"}]}}'
          kubectl -n damga rollout status deploy/ci-stateful --timeout=180s

          # Deleting the workload must not delete the data. An owner reference
          # here would take a tenant's volume on the next redeploy.
          kubectl -n damga delete workload ci-stateful
          sleep 5
          [ "$(kubectl -n damga get pvc ci-stateful-data -o jsonpath='{.status.phase}')" = Bound ] \
            || { echo "deleting the workload deleted its data"; exit 1; }
          kubectl -n damga delete pvc ci-stateful-data

      # The whole build path, against a real repository: clone from GitHub,
      # build the Dockerfile with rootless BuildKit, push to the in-cluster
      # registry, and report the digest back through the termination log.
      #
      # This repository at this commit, and app/ inside it, because a fixture
      # repository would be a Dockerfile written to make the build pass. The
      # thing being tested is whether an ordinary repository builds.
      # The redis engine, which shipped green and had never started.
      #
      # The session that absorbed chart/templates/redis.yaml tested it at the
      # render level — the StatefulSet, the port, the secret key, the fsGroup —
      # and said plainly that no pod had ever run. That is the same gap the
      # buildpack path had: a second branch of a type, proved by tests that
      # stand up no cluster. `--requirepass "$REDIS_PASSWORD"` is a shell
      # expansion inside a container spec, and whether it expands is not a
      # question a unit test can answer.
      - name: A redis Database must reach Ready and take a password
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: platform.damga.co/v1alpha1
          kind: Database
          metadata:
            name: ci-redis
            namespace: damga
          spec:
            engine: redis
            image: redis:8.2.4
            storage: 128Mi
          EOF
          kubectl -n damga wait --for=condition=Ready database/ci-redis --timeout=300s || {
            echo "::group::why redis did not start"
            kubectl -n damga get database ci-redis -o jsonpath='{.status.conditions}' | tr ',' '\n'
            kubectl -n damga get pod,pvc -l app.kubernetes.io/instance=ci-redis -o wide
            kubectl -n damga describe pod -l app.kubernetes.io/instance=ci-redis | tail -30
            kubectl -n damga logs -l app.kubernetes.io/instance=ci-redis --tail=40 || true
            echo "::endgroup::"
            exit 1
          }

          # The password has to have reached the server, not merely the Secret.
          # An unauthenticated PING answering PONG would mean --requirepass never
          # took effect, which is the failure this engine can have while looking
          # entirely healthy.
          pass=$(kubectl -n damga get secret ci-redis -o jsonpath='{.data.REDIS_PASSWORD}' | base64 -d)
          [ -n "$pass" ] || { echo "no password in the secret"; exit 1; }

          # env -u, and the first version of this step is why. It ran redis-cli
          # plainly, inside the container — where REDISCLI_AUTH is set, because
          # that is how the probes authenticate. redis-cli read it, logged in,
          # and answered PONG, and the step called that a missing password. The
          # assertion was wrong, not the server. Unsetting the variable is what
          # makes the connection actually unauthenticated.
          kubectl -n damga exec statefulset/ci-redis -- \
            env -u REDISCLI_AUTH redis-cli ping 2>&1 | grep -qi 'NOAUTH\|auth' \
            || { echo "redis answered an unauthenticated PING — requirepass did not take"; exit 1; }

          kubectl -n damga exec statefulset/ci-redis -- \
            env REDISCLI_AUTH="$pass" redis-cli set ci-probe ok | grep -qx OK \
            || { echo "an authenticated write failed"; exit 1; }
          kubectl -n damga exec statefulset/ci-redis -- \
            env REDISCLI_AUTH="$pass" redis-cli get ci-probe | grep -qx ok \
            || { echo "what was written did not come back"; exit 1; }

          kubectl -n damga delete database ci-redis

      # A deploy that fails has to reach a person, and this is the only place
      # the whole path runs at once.
      #
      # What the unit tests cannot reach: the shipped binary reading a webhook
      # URL out of a mounted Secret, the pod resolving a receiver and posting to
      # it, and a real deploy through the real API producing the transition that
      # sends it. The deploy is made to fail on purpose — it names a repository
      # nothing answers on — because a failed deploy is the notification worth
      # having, and because it is also the only deploy this job can perform:
      # there is no git server here to succeed against.
      #
      # The receiver is a pod rather than a listener on the runner. The control
      # plane then reaches it by Service name over the network it already uses,
      # with no gateway address to guess, and `kubectl logs` is how the body
      # comes back.
      - name: A failed deploy must reach a webhook, saying which app and why
        run: |
          cat > /tmp/receiver.py <<'PY'
          import http.server
          import sys


          class Handler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  length = int(self.headers.get("content-length") or 0)
                  sys.stdout.write(self.rfile.read(length).decode("utf-8", "replace") + "\n")
                  sys.stdout.flush()
                  self.send_response(200)
                  self.end_headers()

              # The default writes a line per request to stderr, which would sit
              # in the same log the assertion greps and could satisfy it without
              # a body ever arriving.
              def log_message(self, *args):
                  pass


          http.server.HTTPServer(("0.0.0.0", 9099), Handler).serve_forever()
          PY
          kubectl -n damga-system create configmap notify-receiver --from-file=receiver.py=/tmp/receiver.py

          kubectl apply -f - <<'YAML'
          apiVersion: v1
          kind: Pod
          metadata:
            name: notify-receiver
            namespace: damga-system
            labels: {app: notify-receiver}
          spec:
            restartPolicy: Never
            securityContext:
              runAsNonRoot: true
              runAsUser: 65532
              seccompProfile: {type: RuntimeDefault}
            containers:
              - name: receiver
                image: python:3.13-alpine
                command: [python3, /app/receiver.py]
                ports: [{containerPort: 9099}]
                volumeMounts:
                  - {name: script, mountPath: /app, readOnly: true}
                securityContext:
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
                  capabilities: {drop: [ALL]}
                resources:
                  requests: {cpu: 10m, memory: 32Mi}
                  limits: {memory: 128Mi}
            volumes:
              - name: script
                configMap: {name: notify-receiver}
          ---
          apiVersion: v1
          kind: Service
          metadata: {name: notify-receiver, namespace: damga-system}
          spec:
            selector: {app: notify-receiver}
            ports: [{port: 9099, targetPort: 9099}]
          YAML
          kubectl -n damga-system wait --for=condition=Ready pod/notify-receiver --timeout=180s

          # Both credentials as mounted Secrets and neither as a flag value.
          # The git token is a placeholder: the push must fail, and what is
          # under test is that the failure is reported rather than that it can
          # authenticate.
          kubectl -n damga-system create secret generic notify-url \
            --from-literal=url=http://notify-receiver.damga-system.svc:9099/hook
          kubectl -n damga-system create secret generic git-token \
            --from-literal=token=not-a-real-token

          # The existing args plus two, read back rather than restated: a second
          # copy of that list in this file is one that stops matching
          # cluster/control-plane.yaml without anything noticing.
          args=$(kubectl -n damga-system get deploy damga -o json \
            | jq -c '.spec.template.spec.containers[0].args
                     + ["-notify-url-file=/etc/damga/notify/url",
                        "-git-token-file=/etc/damga/git/token"]')
          kubectl -n damga-system patch deployment damga --type=json -p "$(jq -n --argjson args "$args" '[
            {"op":"replace","path":"/spec/template/spec/containers/0/args","value":$args},
            {"op":"add","path":"/spec/template/spec/volumes/-",
             "value":{"name":"notify","secret":{"secretName":"notify-url"}}},
            {"op":"add","path":"/spec/template/spec/volumes/-",
             "value":{"name":"git","secret":{"secretName":"git-token"}}},
            {"op":"add","path":"/spec/template/spec/containers/0/volumeMounts/-",
             "value":{"name":"notify","mountPath":"/etc/damga/notify","readOnly":true}},
            {"op":"add","path":"/spec/template/spec/containers/0/volumeMounts/-",
             "value":{"name":"git","mountPath":"/etc/damga/git","readOnly":true}}
          ]')"
          kubectl -n damga-system rollout status deployment/damga --timeout=300s

          # Said at startup, so a URL that cannot be posted to is a process that
          # does not start. Asserted here as well, because the alternative to
          # reading it is discovering later that notifications were off and the
          # body assertion below had been vacuous.
          kubectl -n damga-system logs deploy/damga | grep -q 'deploy notifications are on' || {
            echo "the control plane started without notifications; the rest of this step proves nothing"
            kubectl -n damga-system logs deploy/damga --tail=40
            exit 1
          }

          kubectl -n damga-system port-forward svc/damga 9000:80 >/dev/null 2>&1 &
          PF=$!
          trap 'kill $PF 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/healthz >/dev/null 2>&1 && break
            sleep 1
          done

          jar=$(mktemp)
          curl -sf -c "$jar" -X POST http://127.0.0.1:9000/api/v1/login \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"owner@example.test\",\"password\":\"${CI_OWNER_PASSWORD}\"}" \
            > /dev/null || { echo "the owner bootstrapped earlier could not sign in"; exit 1; }
          tenant=$(curl -sf -b "$jar" http://127.0.0.1:9000/api/v1/me | jq -r '.memberships[0].tenantId')
          [ -n "$tenant" ] && [ "$tenant" != "null" ] || { echo "no tenant came back from /me"; exit 1; }

          curl -sf -b "$jar" -X POST "http://127.0.0.1:9000/api/v1/tenants/${tenant}/apps" \
            -H 'Content-Type: application/json' \
            -d '{"app":"notify-probe","env":"prod",
                 "repoUrl":"https://127.0.0.1:1/nope.git","branch":"main",
                 "path":"apps/notify-probe","namespace":"notify-probe"}' > /dev/null

          # Nothing answers on 127.0.0.1:1 inside that pod, so the push is
          # refused at once. The record is appended before the push is
          # attempted, which is what makes the failure reportable at all.
          code=$(curl -s -o /tmp/deploy.out -w '%{http_code}' -b "$jar" -X POST \
            "http://127.0.0.1:9000/api/v1/tenants/${tenant}/apps/notify-probe/envs/prod/deploys" \
            -H 'Content-Type: application/json' -d '{"image":"registry.example.test/acme/api:1"}')
          echo "the deploy answered ${code}: $(cat /tmp/deploy.out)"
          [ "$code" = "502" ] || {
            echo "the deploy was expected to fail its push and answered ${code}; no failure was recorded"
            exit 1
          }

          for _ in $(seq 1 30); do
            kubectl -n damga-system logs pod/notify-receiver | grep -q notify-probe && break
            sleep 1
          done
          body=$(kubectl -n damga-system logs pod/notify-receiver)
          echo "::group::what the receiver was posted"
          echo "$body"
          echo "::endgroup::"

          # Not "a request arrived". A receiver that answers 200 to an empty
          # body would pass that, and so would one posted a message about a
          # different application.
          for want in notify-probe prod failed 'the commit was never pushed'; do
            grep -q "$want" <<<"$body" || {
              echo "the notification never said '${want}', so it cannot tell anybody what happened"
              exit 1
            }
          done

      # The product's headline feature, on a real cluster for the first time.
      #
      # Every step above proves a piece the platform wrote for itself. This one
      # takes an entry a user would click — a third-party image, its own
      # environment, its own volume, a credential it expects somebody to invent
      # — and asserts the whole way to the application answering for itself.
      #
      # What it does not cover is said plainly: the real install path writes
      # this manifest through a git commit that Argo CD applies, and this job
      # has neither a git remote nor Argo CD. So it applies the manifest
      # directly, and TestTheEndToEndManifestIsWhatTheCatalogueProduces renders
      # the same file through renderInstall and fails if a byte differs — which
      # is what stops the committed copy becoming a fixture that proves nothing.
      - name: An application installed from the catalogue must serve its own API
        run: |
          start=$(date +%s)

          # The control plane is already running, and that is itself most of the
          # proof that its image carries the templates: catalogSource is fatal
          # when -catalog-dir names a directory catalog.Load refuses, and it
          # refuses an empty one. Measured further back than that — take the
          # re-include out of .dockerignore and the image build fails at the
          # COPY with "/workspace/catalog/templates: not found", so a catalogue
          # that is missing cannot get as far as this job.
          #
          # What is asserted here is the flag that connects the image to the
          # server, because a deployment that quietly lost it would serve
          # everything except this and look entirely healthy.
          kubectl -n damga-system get deployment damga \
            -o jsonpath='{.spec.template.spec.containers[0].args}' \
            | grep -q -- '-catalog-dir=' || {
            echo "the control plane is running without -catalog-dir, so its catalogue is off"
            echo "and every /catalog request answers 503; see cluster/control-plane.yaml"
            exit 1
          }

          kubectl apply -f server/testdata/catalog-gotify.yaml
          kubectl -n damga wait --for=condition=Ready workload/ci-gotify --timeout=300s || {
            echo "::group::why the catalogue install did not become Ready"
            kubectl -n damga get workload ci-gotify -o jsonpath='{.status.conditions}' | tr ',' '\n'
            kubectl -n damga get pod,pvc,secret -l app.kubernetes.io/instance=ci-gotify -o wide
            kubectl -n damga describe pod -l app.kubernetes.io/instance=ci-gotify | tail -40
            kubectl -n damga logs -l app.kubernetes.io/instance=ci-gotify --tail=60 || true
            kubectl -n damga get events --sort-by=.lastTimestamp | tail -20
            echo "::endgroup::"
            exit 1
          }
          ready=$(date +%s)

          # From ingress-nginx and not from this namespace. The Workload's own
          # NetworkPolicy allows ingress from there and refuses everything else,
          # so a probe run beside it answers 000 — which reads as an application
          # that never started rather than as the fence doing its job.
          probe() { # $1 name, $2 the shell command, already JSON-quoted
            kubectl -n ingress-nginx run "$1" --rm -i --restart=Never \
              --image=curlimages/curl:8.11.1 --quiet \
              --overrides='{"spec":{"securityContext":{"runAsNonRoot":true,"runAsUser":1000,"seccompProfile":{"type":"RuntimeDefault"}},"containers":[{"name":"'"$1"'","image":"curlimages/curl:8.11.1","command":["sh","-c",'"$2"'],"securityContext":{"allowPrivilegeEscalation":false,"readOnlyRootFilesystem":true,"capabilities":{"drop":["ALL"]}},"resources":{"requests":{"cpu":"10m","memory":"32Mi"},"limits":{"memory":"64Mi"}}}]}}' \
              -- sh
          }

          # Ready is not the claim. Gotify answering its own /health with green,
          # and green for the database it keeps on the volume the catalogue
          # asked for, is: a pod can be Ready with its storage unmounted.
          probe catalogue-health '"echo status=$(curl -s -o /dev/null -w %{http_code} --max-time 15 http://ci-gotify.damga.svc/health); echo body:; curl -s --max-time 15 http://ci-gotify.damga.svc/health"' \
            | tee /tmp/gotify.out
          answered=$(date +%s)
          grep -q '"health":"green"' /tmp/gotify.out || {
            echo "::group::the application did not report itself healthy"
            echo "what the probe saw:"; cat /tmp/gotify.out
            echo "-- status= above is an HTTP code; no line at all means the probe"
            echo "-- pod produced no output, which is a different failure."
            kubectl -n damga get deploy,pod,svc,endpoints,networkpolicy -o wide || true
            kubectl -n damga logs -l app.kubernetes.io/instance=ci-gotify --tail=60 || true
            echo "::endgroup::"
            exit 1
          }

          # And the credential the platform invented has to be the one the
          # application is using. The template asks for SERVICE_PASSWORD_GOTIFY,
          # the operator mints it into ci-gotify-generated, and gotify takes it
          # as its admin password — if any link in that chain is broken the
          # value in the Secret still looks perfectly correct.
          pass=$(kubectl -n damga get secret ci-gotify-generated \
            -o jsonpath='{.data.GOTIFY_DEFAULTUSER_PASS}' | base64 -d)
          [ -n "$pass" ] || { echo "the operator minted no GOTIFY_DEFAULTUSER_PASS"; exit 1; }
          case "$pass" in *[!A-Za-z0-9_-]*)
            echo "the minted password is outside the alphabet this step can pass through a shell"
            exit 1 ;;
          esac
          # Both directions, because an application that accepts anything would
          # pass the first assertion on its own. Only the status codes are
          # printed; the password never is.
          probe catalogue-auth '"echo minted=$(curl -s -o /dev/null -w %{http_code} --max-time 15 -u admin:'"$pass"' http://ci-gotify.damga.svc/current/user); echo wrong=$(curl -s -o /dev/null -w %{http_code} --max-time 15 -u admin:definitely-not-it http://ci-gotify.damga.svc/current/user)"' \
            | tee /tmp/gotify-auth.out
          grep -q 'minted=200' /tmp/gotify-auth.out || {
            echo "the password the operator minted is not the one the application accepts:"
            echo "the Secret exists and its value never reached the container"
            cat /tmp/gotify-auth.out; exit 1
          }
          grep -q 'wrong=401' /tmp/gotify-auth.out || {
            echo "the application accepted a password nobody minted, so the check above"
            echo "proves nothing about where the real one came from"
            cat /tmp/gotify-auth.out; exit 1
          }

          # The number docs/DURUM.md section 4 item 6 was waiting for. Printed
          # rather than asserted: it is a measurement of this runner on this
          # day, and a threshold here would fail on a slow one without anything
          # being wrong.
          echo "catalogue install: apply to Ready $((ready-start))s," \
               "apply to a healthy answer $((answered-start))s"

          kubectl -n damga delete workload ci-gotify

      # The half of the fence nothing had ever tested, and docs/PLAN.md is the
      # reason to test it: it says the NetworkPolicy has to be relaxed in phase A
      # because catalogue applications need to reach the internet. Measured on a
      # real cluster, they already can — the operator's egress rule is
      # 0.0.0.0/0 minus link-local, so the relaxation that document asks for is
      # for a direction that is not blocked.
      #
      # What is blocked is east-west: the ingress rule admits the ingress-nginx
      # namespace and nothing else, so one workload of a multi-service entry
      # cannot reach another. That is a defect rather than a property, so it is
      # written down in docs and not frozen into a gate here.
      #
      # This brings its own Workload rather than using ci-gotify, which the step
      # above deletes. Only its NetworkPolicy is needed: the probe carries the
      # selector labels, so the same policy selects it.
      - name: A catalogue application can reach the internet
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: platform.damga.co/v1alpha1
          kind: Workload
          metadata:
            name: ci-egress
            namespace: damga
          spec:
            image: redis:7-alpine
            port: 6379
          EOF
          for i in $(seq 1 30); do
            kubectl -n damga get networkpolicy ci-egress >/dev/null 2>&1 && break
            sleep 2
          done
          kubectl -n damga get networkpolicy ci-egress >/dev/null 2>&1 || {
            echo "the operator rendered no NetworkPolicy for ci-egress, so this step would"
            echo "have measured an unfenced pod and called the fence open"
            exit 1
          }

          # In the workload's own namespace and carrying its selector labels,
          # which is what puts the probe inside the policy rather than beside it.
          kubectl -n damga run ci-egress-probe --restart=Never --quiet \
            --labels="app.kubernetes.io/name=ci-egress,app.kubernetes.io/instance=ci-egress" \
            --image=curlimages/curl:8.11.1 \
            --overrides='{"spec":{"securityContext":{"runAsNonRoot":true,"runAsUser":1000,"seccompProfile":{"type":"RuntimeDefault"}},"containers":[{"name":"ci-egress-probe","image":"curlimages/curl:8.11.1","command":["sh","-c","echo dns=$(nslookup example.com >/dev/null 2>&1 && echo ok || echo FAIL); echo out=$(curl -s -o /dev/null -w %{http_code} --max-time 25 https://example.com)"],"securityContext":{"allowPrivilegeEscalation":false,"readOnlyRootFilesystem":true,"capabilities":{"drop":["ALL"]}},"resources":{"requests":{"cpu":"10m","memory":"32Mi"},"limits":{"memory":"64Mi"}}}]}}'

          for i in $(seq 1 60); do
            phase=$(kubectl -n damga get pod ci-egress-probe -o jsonpath='{.status.phase}' 2>/dev/null || true)
            case "$phase" in Succeeded|Failed) break ;; esac
            sleep 2
          done
          kubectl -n damga logs ci-egress-probe > /tmp/egress.out 2>&1 || true
          cat /tmp/egress.out

          grep -qx 'dns=ok' /tmp/egress.out || {
            echo "a workload cannot resolve a name. The egress rule allows UDP and TCP 53 to"
            echo "kube-dns in kube-system and nowhere else; a resolver that moved, or a label"
            echo "that changed on that pod, takes name resolution out with it."
            exit 1
          }
          # Any status code means the connection was made. A specific one would
          # be asserting something about example.com rather than about the fence.
          grep -q 'out=000' /tmp/egress.out && {
            echo "a workload could not reach the internet: curl returned 000, which is a"
            echo "connection that never happened rather than a server that said no."
            echo "The egress rule is 0.0.0.0/0 minus link-local; something narrowed it."
            exit 1
          }
          grep -q 'out=' /tmp/egress.out || { echo "the probe produced no output at all"; exit 1; }

          kubectl -n damga delete pod ci-egress-probe --wait=false
          kubectl -n damga delete workload ci-egress

      # The other half of the same fence, and the half that was closed.
      #
      # The step above proves a catalogue application can reach the internet.
      # This one proves it can reach the workload beside it — which it could not,
      # measured on a real cluster: a probe carrying a workload's own labels got
      # 200 from example.com and 000 from a sibling Service. Egress was never the
      # problem; the destination admitted the ingress controller and nobody else,
      # so an entry with a front end and a worker installed cleanly and could not
      # talk to itself.
      #
      # Both probes run in the tenant's namespace, and the only difference
      # between them is one label. That is the whole assertion: the rule admits
      # the entry's own pods and still refuses the neighbour, so it is a door in
      # the fence rather than the fence being gone.
      - name: An entry's workloads can reach each other, and nobody else can
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: platform.damga.co/v1alpha1
          kind: Workload
          metadata:
            name: ew-target
            namespace: damga
            labels:
              damga.co/from-compose: ci-east-west
          spec:
            image: damga-app:${IMAGE_TAG}
            port: 3000
          EOF
          kubectl -n damga wait --for=condition=Ready workload/ew-target --timeout=180s || {
            kubectl -n damga get workload ew-target -o jsonpath='{.status.conditions}' | tr ',' '\n'
            kubectl -n damga describe pod -l app.kubernetes.io/instance=ew-target | tail -30
            exit 1
          }

          # The label reaching the pod is what the policy selects on. Asserted
          # before the probes, because a missing label makes the sibling probe
          # fail for a reason that has nothing to do with the rule.
          kubectl -n damga get pod -l app.kubernetes.io/instance=ew-target \
            -o jsonpath='{.items[0].metadata.labels.damga\.co/from-compose}' | grep -q ci-east-west || {
            echo "::error::the entry label did not reach the pod, so the policy selects nothing"
            kubectl -n damga get pod -l app.kubernetes.io/instance=ew-target -o yaml | head -40
            exit 1
          }

          # $1 name, $2 extra pod labels as JSON
          eastwest_probe() {
            kubectl -n damga run "$1" --rm -i --restart=Never --quiet \
              --image=curlimages/curl:8.11.1 \
              --overrides='{"metadata":{"labels":'"$2"'},"spec":{"securityContext":{"runAsNonRoot":true,"runAsUser":1000,"seccompProfile":{"type":"RuntimeDefault"}},"containers":[{"name":"'"$1"'","image":"curlimages/curl:8.11.1","command":["sh","-c","echo status=$(curl -s -o /dev/null -w %{http_code} --max-time 10 http://ew-target.damga.svc/healthz)"],"securityContext":{"allowPrivilegeEscalation":false,"readOnlyRootFilesystem":true,"capabilities":{"drop":["ALL"]}},"resources":{"requests":{"cpu":"10m","memory":"32Mi"},"limits":{"memory":"64Mi"}}}]}}' \
              -- sh
          }

          eastwest_probe ew-sibling '{"damga.co/from-compose":"ci-east-west"}' | tee /tmp/ew-sibling.out
          grep -q 'status=200' /tmp/ew-sibling.out || {
            echo "::group::a workload of the same entry could not reach it"
            echo "what the probe saw:"; cat /tmp/ew-sibling.out
            echo "-- status=000 means the connection was refused before any HTTP answer,"
            echo "-- which is what a NetworkPolicy with no rule for this peer produces."
            kubectl -n damga get networkpolicy ew-target -o yaml
            echo "::endgroup::"
            exit 1
          }

          eastwest_probe ew-stranger '{"app":"not-this-entry"}' | tee /tmp/ew-stranger.out
          grep -q 'status=000' /tmp/ew-stranger.out || {
            echo "::error::a pod that belongs to no entry reached the application; the rule is supposed to admit one entry's own pods and this says it admits the namespace"
            cat /tmp/ew-stranger.out
            kubectl -n damga get networkpolicy ew-target -o yaml
            exit 1
          }

          kubectl -n damga delete workload ew-target --ignore-not-found

      # The link the product was missing until today, and the measurement the
      # design turns on.
      #
      # Nothing in this repository installed Argo CD — the installer said so in
      # its own list of what it does not do, "Argo CD. Nothing applies what a
      # deploy commits" — so a tenant's manifests were committed correctly and
      # watched by nothing. Two things are proved here, in the order they have
      # to hold: that a namespace and its quota arrive together from git, and
      # that the fence around them survives being taken down.
      #
      # The second is why the fence is a manifest at all. Measured against this
      # Argo CD: a namespace created through CreateNamespace=true and labelled
      # through managedNamespaceMetadata never got a removed pod-security label
      # back — not in four minutes, not after a forced sync, not after a hard
      # refresh — while the Application reported Synced and Healthy throughout.
      # Committed as ordinary manifests, the same label came back in five
      # seconds. An Argo CD upgrade that quietly changed that would take the
      # fence with it, so it is measured on every run.
      - name: Argo CD applies what a commit says, and puts the fence back
        run: |
          # The control plane has to be able to write the Application it
          # delivers, and RBAC is the half that fails silently: the endpoint
          # answers 201 either way and only the "delivery" line in the body
          # says which happened.
          kubectl auth can-i create applications.argoproj.io -n argocd \
            --as=system:serviceaccount:damga-system:damga | grep -qx yes || {
            echo "::error::the control plane may not create Argo CD Applications, so every"
            echo "::error::install commits manifests that nothing will ever apply"
            exit 1
          }

          cat <<EOF | kubectl apply -f -
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: delivery-probe
            namespace: argocd
          spec:
            project: default
            source:
              repoURL: https://github.com/${{ github.repository }}
              path: test/delivery
              targetRevision: ${{ github.sha }}
            destination:
              server: https://kubernetes.default.svc
              namespace: damga-delivery-probe
            syncPolicy:
              automated: { prune: true, selfHeal: true }
          EOF

          # The container and what bounds it, in one sync. A namespace that
          # arrives without its quota is the failure this ordering exists to
          # prevent, so both are waited for.
          for _ in $(seq 1 60); do
            kubectl get ns damga-delivery-probe >/dev/null 2>&1 && \
              kubectl -n damga-delivery-probe get resourcequota probe-quota >/dev/null 2>&1 && break
            sleep 5
          done
          kubectl get ns damga-delivery-probe -o jsonpath='{.metadata.labels}' | tee /tmp/fence.out
          echo
          grep -q '"pod-security.kubernetes.io/enforce":"restricted"' /tmp/fence.out || {
            echo "::error::the namespace arrived without its pod-security label, so a workload"
            echo "::error::would land in a namespace with no fence"
            kubectl -n argocd get app delivery-probe -o yaml | tail -40
            exit 1
          }
          kubectl -n damga-delivery-probe get resourcequota probe-quota >/dev/null || {
            echo "::error::the namespace came without the quota that bounds it"
            exit 1
          }

          # And now take the fence down by hand.
          kubectl label ns damga-delivery-probe pod-security.kubernetes.io/enforce-
          back=""
          for _ in $(seq 1 36); do
            v=$(kubectl get ns damga-delivery-probe \
                  -o jsonpath='{.metadata.labels.pod-security\.kubernetes\.io/enforce}' 2>/dev/null)
            [ -n "$v" ] && { back="yes"; break; }
            sleep 5
          done
          [ -n "$back" ] || {
            echo "::error::a pod-security label removed from a delivered namespace was not put"
            echo "::error::back within three minutes. The fence can be taken down and nothing"
            echo "::error::calls it drift, which is exactly the behaviour these manifests exist"
            echo "::error::to avoid; see internal/manifest/fence.go"
            kubectl -n argocd get app delivery-probe -o jsonpath='{.status.sync.status} {.status.health.status}'
            exit 1
          }
          echo "the fence was removed and restored"

          kubectl -n argocd delete app delivery-probe --ignore-not-found
          kubectl delete ns damga-delivery-probe --ignore-not-found --wait=false

      - name: A Build must produce an image the cluster can pull
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: platform.damga.co/v1alpha1
          kind: Build
          metadata:
            name: ci-build
            namespace: damga-build
          spec:
            repo: https://github.com/${{ github.repository }}.git
            revision: ${{ github.sha }}
            path: app
            image: ${REGISTRY_HOST}/ci/app
            builder: dockerfile
          EOF

          # Waited on the phase rather than a condition, because a build that
          # fails is a normal outcome of this test and has to be reported with
          # its own message rather than as a timeout.
          for i in $(seq 1 90); do
            phase=$(kubectl -n damga-build get build ci-build -o jsonpath='{.status.phase}' 2>/dev/null || true)
            [ "$phase" = Succeeded ] && break
            if [ "$phase" = Failed ]; then
              echo "the build failed:"
              kubectl -n damga-build get build ci-build -o jsonpath='{.status.message}'; echo
              kubectl -n damga-build logs job/ci-build --tail=60 || true
              exit 1
            fi
            sleep 10
          done
          [ "$phase" = Succeeded ] || {
            echo "the build never finished; phase=$phase"
            kubectl -n damga-build describe job ci-build | tail -30
            kubectl -n damga-build logs job/ci-build --tail=60 || true
            exit 1
          }

          digest=$(kubectl -n damga-build get build ci-build -o jsonpath='{.status.digest}')
          case "$digest" in sha256:*) ;; *) echo "no digest recorded"; exit 1 ;; esac
          echo "built ${digest}"

          # The half that the digest alone does not prove: the kubelet, on the
          # node's network, can resolve and pull the name the build pushed. That
          # is the redirect this registry exists to make work, and it fails
          # separately from the build.
          # The probe carries a full restricted security context and declares
          # its resources, because the tenant namespace enforces both — and a
          # probe that cannot satisfy the rules a tenant lives under is not
          # testing what a tenant would experience. Both were found by the
          # namespace refusing it, one round each.
          #
          # It makes two assertions rather than one: the kubelet can resolve and pull
          # the name the build pushed, and the image the build produced can run
          # under the same rules a tenant's workload does. The first version
          # was a bare `kubectl run` and the namespace refused it — the test
          # failed on the test, one line after the build had finally worked.
          kubectl -n damga run pull-probe --restart=Never \
            --image="${REGISTRY_HOST}/ci/app@${digest}" \
            --overrides="$(cat <<JSON
          {
            "spec": {
              "securityContext": {
                "runAsNonRoot": true,
                "runAsUser": 1000,
                "seccompProfile": {"type": "RuntimeDefault"}
              },
              "containers": [{
                "name": "pull-probe",
                "image": "${REGISTRY_HOST}/ci/app@${digest}",
                "command": ["sleep", "30"],
                "securityContext": {
                  "allowPrivilegeEscalation": false,
                  "readOnlyRootFilesystem": true,
                  "capabilities": {"drop": ["ALL"]}
                },
                "resources": {
                  "requests": {"cpu": "10m", "memory": "32Mi"},
                  "limits": {"memory": "64Mi"}
                }
              }]
            }
          }
          JSON
          )"
          kubectl -n damga wait --for=condition=Ready pod/pull-probe --timeout=180s || {
            kubectl -n damga describe pod pull-probe | tail -25
            exit 1
          }
          kubectl -n damga delete pod pull-probe --wait=false
          kubectl -n damga-build delete build ci-build

      # The other half of the builder, which until now shipped green and had
      # never run. The step above uses builder: dockerfile, so every line of the
      # Cloud Native Buildpacks path — five lifecycle phases, a 1.2 GB builder
      # image, a run image fetched from Docker Hub — passed CI without being
      # executed once. That is the same shape as two packages that shipped for
      # days with a hand-written GO_PKGS list they were missing from.
      #
      # builder: buildpack rather than detect, because app/ has a Dockerfile and
      # detect would correctly choose it. Naming the method is what forces the
      # path under test.
      #
      # Four things are measured here that were guesses. Each is printed whether
      # the step passes or fails, because a number nobody wrote down is a number
      # that gets invented again next time.
      - name: A buildpack build, and what it actually costs
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: platform.damga.co/v1alpha1
          kind: Build
          metadata:
            name: ci-buildpack
            namespace: damga-build
          spec:
            repo: https://github.com/${{ github.repository }}.git
            revision: ${{ github.sha }}
            path: app
            image: ${REGISTRY_HOST}/ci/app-buildpack
            builder: buildpack
          EOF

          started=$(date +%s)
          phase=""
          # Bounded below the Job's own 30-minute deadline, so a build that is
          # merely slow is distinguishable from one that the deadline killed.
          for i in $(seq 1 108); do
            phase=$(kubectl -n damga-build get build ci-buildpack -o jsonpath='{.status.phase}' 2>/dev/null || true)
            [ "$phase" = Succeeded ] && break
            [ "$phase" = Failed ] && break
            sleep 10
          done
          elapsed=$(( $(date +%s) - started ))

          echo "::group::what the buildpack path cost"
          echo "phase      : ${phase:-<none>} after ${elapsed}s"
          echo "deadline   : 1800s (Job activeDeadlineSeconds)"
          # The pull is inside that deadline, which is the thing worth knowing:
          # a 1.2 GB image on a slow link eats the budget the build needs.
          kubectl -n damga-build get events --field-selector reason=Pulled \
            -o custom-columns=OBJ:.involvedObject.name,MSG:.message --no-headers 2>/dev/null | tail -5
          kubectl -n damga-build get build ci-buildpack \
            -o jsonpath='{.status.method}{"  "}{.status.digest}{"\n"}' 2>/dev/null || true
          echo "::endgroup::"

          if [ "$phase" != Succeeded ]; then
            echo "::group::why it did not succeed"
            kubectl -n damga-build get build ci-buildpack -o jsonpath='{.status.message}'; echo
            kubectl -n damga-build describe job ci-buildpack | tail -25
            kubectl -n damga-build logs job/ci-buildpack --all-containers --tail=80 || true
            echo "::endgroup::"
            exit 1
          fi

          digest=$(kubectl -n damga-build get build ci-buildpack -o jsonpath='{.status.digest}')
          case "$digest" in sha256:*) ;; *) echo "no digest recorded"; exit 1 ;; esac

          # Second build of the same source, to separate what the 1.2 GB costs
          # once from what every build costs. Without this the first number is
          # unattributable.
          kubectl -n damga-build delete build ci-buildpack
          cat <<EOF | kubectl apply -f -
          apiVersion: platform.damga.co/v1alpha1
          kind: Build
          metadata:
            name: ci-buildpack-2
            namespace: damga-build
          spec:
            repo: https://github.com/${{ github.repository }}.git
            revision: ${{ github.sha }}
            path: app
            image: ${REGISTRY_HOST}/ci/app-buildpack
            builder: buildpack
          EOF
          started=$(date +%s)
          for i in $(seq 1 108); do
            phase=$(kubectl -n damga-build get build ci-buildpack-2 -o jsonpath='{.status.phase}' 2>/dev/null || true)
            [ "$phase" = Succeeded ] || [ "$phase" = Failed ] && break
            sleep 10
          done
          echo "second build: $phase after $(( $(date +%s) - started ))s (builder image already on the node)"
          kubectl -n damga-build delete build ci-buildpack-2 || true

      # Two collectors, and the reason they are checked here rather than
      # trusted: both of them delete, and a deleter that deletes nothing looks
      # exactly like a store with nothing to delete.
      #
      # scripts/registry-gc-test.sh pushes its own images and its own build
      # cache, runs the collector, and asks the store — not the job's report —
      # what is left. It also backdates a cache link so that the rule for a
      # repository nobody builds any more is exercised in a run rather than in a
      # fortnight.
      - name: The collectors actually delete
        run: ./scripts/registry-gc-test.sh

      # And the one string this repository could not measure for itself.
      #
      # server/builds.go tells a full namespace apart from a missing permission
      # by the words the API server uses, because both arrive as Forbidden and
      # for a long time both were reported as "the control plane is not
      # permitted to create builds" — a sentence that is true of a RoleBinding
      # nobody has touched. The token it keys on is "exceeded quota", and that
      # is Kubernetes' wording rather than this project's, so it is checked
      # against a live API server here. envtest cannot: it runs no quota
      # controller, and five creates against a quota of two all succeeded.
      - name: The build quota refuses out loud
        run: |
          restore() {
            kubectl -n damga-build patch resourcequota build-quota --type=merge \
              -p '{"spec":{"hard":{"count/builds.platform.damga.co":"200"}}}' >/dev/null
          }
          trap restore EXIT

          # Zero rather than the count in use: the quota may be exceeded by a
          # hard limit below usage, and a number computed from usage would race
          # the collector this same job is proving works.
          kubectl -n damga-build patch resourcequota build-quota --type=merge \
            -p '{"spec":{"hard":{"count/builds.platform.damga.co":"0"}}}'

          # The quota controller has to observe the new limit before admission
          # enforces it; until it does, the create succeeds and proves nothing.
          refusal=""
          for _ in $(seq 1 30); do
            refusal=$(kubectl apply -f - <<'EOF' 2>&1 >/dev/null || true
          apiVersion: platform.damga.co/v1alpha1
          kind: Build
          metadata:
            name: ci-quota-probe
            namespace: damga-build
          spec:
            repo: https://github.com/damgahq/damga.git
            revision: 0123456789abcdef0123456789abcdef01234567
            image: registry.damga-registry.svc:5000/ci/quota-probe
            builder: dockerfile
          EOF
            )
            [ -n "$refusal" ] && break
            kubectl -n damga-build delete build ci-quota-probe --ignore-not-found >/dev/null
            sleep 2
          done

          echo "the API server said: $refusal"
          case "$refusal" in
            *"exceeded quota"*)
              echo "the control plane's classifier keys on a string the API server really uses" ;;
            "")
              echo "::error::the quota admitted a create with a hard limit of zero; nothing here tested what a full namespace does" >&2
              exit 1 ;;
            *)
              echo "::error::a full quota is refused with wording server/builds.go does not recognise, so a full namespace is still reported as a missing permission" >&2
              exit 1 ;;
          esac

      - name: Deleting the Workload must leave nothing behind
        run: |
          kubectl -n damga delete workload ci-probe --wait=true
          for _ in $(seq 1 30); do
            left=$(kubectl -n damga get deploy,svc,sa,networkpolicy,pdb \
                     -l app.kubernetes.io/managed-by=damga-platform \
                     --no-headers 2>/dev/null | wc -l)
            [ "$left" -eq 0 ] && { echo "owner references cascaded"; exit 0; }
            sleep 2
          done
          echo "objects outlived the Workload that owned them:"
          kubectl -n damga get all -l app.kubernetes.io/managed-by=damga-platform
          exit 1

      # The cluster is deleted when this job ends, so whatever is not printed
      # here is gone. That is not hypothetical: a Workload once sat at
      # NoReadyReplicas for three minutes and the only evidence captured was
      # phase and image, both of which said the pods were fine. Two more runs
      # were spent re-failing it on purpose to collect what should have been
      # here the first time — the pods were Ready all along and the Deployment's
      # own status was the thing stuck.
      #
      # So this collects the three things that dead end cost: whether the
      # container is ready as opposed to merely running, what the controllers
      # this operator shares its objects with are saying, and the operator's own
      # log. The operator lives in another namespace and had never been read at
      # all.
      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "::group::workloads and their status"
          kubectl -n damga get workloads -o wide || true
          kubectl -n damga describe workloads || true
          echo "::endgroup::"

          echo "::group::damga namespace"
          kubectl -n damga get all,pvc,networkpolicy,ingress
          # READY and RESTARTS are the two columns whose absence sent the last
          # investigation after the wrong controller.
          kubectl -n damga get pods -o wide
          kubectl -n damga describe pods
          echo "::endgroup::"

          echo "::group::deployment status, which is not the same as pod status"
          # A Deployment can report zero ready replicas while its own ReplicaSet
          # and every pod under it report otherwise. Printing all three is what
          # tells those apart.
          kubectl -n damga get deployments,replicasets -o wide || true
          kubectl -n damga describe deployments || true
          echo "::endgroup::"

          echo "::group::the operator"
          kubectl -n damga-platform-system get pods -o wide || true
          kubectl -n damga-platform-system describe pods || true
          kubectl -n damga-platform-system logs \
            deployment/damga-platform-controller-manager \
            --tail=300 --all-containers --prefix || true
          echo "::endgroup::"

          echo "::group::the controllers this operator shares objects with"
          # A conflict between this operator and a built-in controller shows up
          # here as "the object has been modified" at a steady rate, and as
          # client-side throttling when one of them is losing the race for the
          # API server.
          kubectl -n kube-system logs kube-controller-manager-ci-control-plane \
            --tail=200 2>/dev/null | grep -Ei 'ci-probe|throttl|cannot be fulfilled' || true
          echo "::endgroup::"

          echo "::group::ingress controller and events"
          kubectl -n ingress-nginx get pods
          kubectl -n damga logs -l app.kubernetes.io/name=damga-app --tail=100 --all-containers || true
          kubectl -n damga get events --sort-by=.lastTimestamp | tail -60
          echo "::endgroup::"

  # ---------------------------------------------------------------- build
  # Each architecture is built on a runner of that architecture.
  #
  # An earlier version built every architecture from one amd64 runner under
  # QEMU. That worked for the API image, whose `npm ci --omit=dev` installs no
  # native code, and did not for an image whose build stage compiled native
  # modules:
  #
  #   #25 [linux/arm64 build 4/7] RUN npm ci
  #   #25 13.93 qemu: uncaught target signal 4 (Illegal instruction) - core dumped
  #
  # buildkit did not fail on that signal. It waited. The job ran for six hours
  # and was killed by the platform maximum, and because publish is what feeds
  # the signature test, a day passed with nothing published and the one rule
  # this repository exists to demonstrate going unproven. Emulating a build is
  # a correctness risk, not just a slow path.
  #
  # Nothing is pushed under a tag here. Each build pushes by digest only, and
  # the job below assembles those digests into the tagged manifest list — so a
  # half-finished set of architectures never appears under a name a cluster
  # could resolve.
  build:
    name: Build the ${{ matrix.arch }} images
    runs-on: ${{ matrix.runner }}
    needs: [image, e2e, operator]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      # Both architectures run to completion even when one fails. Cancelling the
      # survivor hides whether the fault is in the build or in the architecture.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the API image
        id: api
        uses: docker/build-push-action@v7
        with:
          context: ./app
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          # Scoped per image and architecture. A single shared scope has both
          # runners writing the same cache manifest, and the loser's layers are
          # simply lost.
          cache-from: type=gha,scope=api-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=api-${{ matrix.arch }}
          provenance: true
          sbom: true

      - name: Build the operator image
        id: operator
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.operator
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE_NAME }}-operator,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=operator-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=operator-${{ matrix.arch }}
          provenance: true
          sbom: true

      # The control plane, from the Dockerfile at the repository root.
      #
      # It is the one image this pipeline built and never published, and the
      # gap survived because of how it is exercised: the e2e job builds it into
      # kind and overrides the Deployment's image field, so nothing here ever
      # pulled the reference cluster/control-plane.yaml names. On a real server
      # that reference was ImagePullBackOff while the manifest looked correct.
      # An installation that cannot pull its own control plane cannot be
      # upgraded, which made this the last item in the mandatory block.
      - name: Build the control plane image
        id: control_plane
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE_NAME }}-control-plane,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=control-plane-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=control-plane-${{ matrix.arch }}
          provenance: true
          sbom: true

      # A matrix job cannot return an output: every leg writes to the same key
      # and the last one to finish wins. The digests travel as files instead.
      #
      # The key is control_plane and not control-plane on purpose: it becomes a
      # step output name below, and `steps.assemble.outputs.control-plane_digest`
      # is parsed by the expression language as a subtraction.
      - name: Record the digests for assembly
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          OPERATOR_DIGEST: ${{ steps.operator.outputs.digest }}
          CONTROL_PLANE_DIGEST: ${{ steps.control_plane.outputs.digest }}
        run: |
          for pair in "api:${API_DIGEST}" "operator:${OPERATOR_DIGEST}" \
                      "control_plane:${CONTROL_PLANE_DIGEST}"; do
            name="${pair%%:*}"
            digest="${pair#*:}"
            [ -n "$digest" ] || { echo "$name: the build reported no digest"; exit 1; }
            mkdir -p "${RUNNER_TEMP}/digests/${name}"
            # The file name is the digest and the contents are empty: the
            # assembly step reads its references straight out of the listing.
            touch "${RUNNER_TEMP}/digests/${name}/${digest#sha256:}"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # -------------------------------------------------------------- publish
  publish:
    name: Publish image
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 15
    outputs:
      api_digest: ${{ steps.assemble.outputs.api_digest }}
    permissions:
      contents: read
      packages: write
      id-token: write        # the OIDC token cosign signs with
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Pinned to cosign 2.x on purpose. cosign 3 writes signatures as a Sigstore
      # bundle (application/vnd.dev.sigstore.bundle.v0.3+json) and offers no way
      # to opt out; a verifier reading only the manifest cannot see that layer
      # having "no signatures found" — a valid signature the enforcer cannot see.
      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v2.6.5
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      # imagetools works on descriptors the registry already holds, so this
      # assembles both multi-architecture images without pulling a layer.
      - name: Assemble the multi-architecture images
        id: assemble
        working-directory: ${{ runner.temp }}/digests
        run: |
          for pair in "api:${IMAGE_NAME}" "operator:${IMAGE_NAME}-operator" \
                      "control_plane:${IMAGE_NAME}-control-plane"; do
            name="${pair%%:*}"
            repo="${pair#*:}"

            # Every architecture the matrix declared, or none at all. A list
            # assembled from one leg would publish under the same tags and drop
            # a platform silently, and `docker pull` on the missing one fails
            # with "no matching manifest" — the failure this build exists to
            # prevent.
            found=$(find "$name" -type f | wc -l | tr -d "[:space:]")
            [ "$found" -eq 2 ] || { echo "$name: expected 2 architectures, found $found"; exit 1; }

            ( cd "$name" && docker buildx imagetools create \
                -t "${repo}:${IMAGE_TAG}" \
                -t "${repo}:${GITHUB_SHA}" \
                -t "${repo}:latest" \
                $(for d in *; do printf '%s@sha256:%s ' "$repo" "$d"; done) )

            digest=$(docker buildx imagetools inspect "${repo}:${IMAGE_TAG}" \
                       --format '{{.Manifest.Digest}}')
            echo "${name}_digest=${digest}" >> "$GITHUB_OUTPUT"
            echo "published ${repo}@${digest}"
          done

      # Keyless: no key to store, rotate or leak. cosign exchanges the
      # workflow's OIDC token for a short-lived certificate from Fulcio and
      # records the signature in the Rekor transparency log. What is verified
      # later is not "someone had the key" but "this workflow, in this
      # repository, produced this digest".
      # --recursive signs the index *and* every per-platform child it references.
      # Signing only the index looks correct and is not: an admission controller
      # resolves a tag to the child manifest for its own platform, then looks for
      # a signature on that digest. Without --recursive it finds none and rejects
      # an image this pipeline really did sign.
      - name: Sign the published images
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign --recursive "${IMAGE_NAME}@${{ steps.assemble.outputs.api_digest }}"
          cosign sign --recursive "${IMAGE_NAME}-operator@${{ steps.assemble.outputs.operator_digest }}"
          cosign sign --recursive \
            "${IMAGE_NAME}-control-plane@${{ steps.assemble.outputs.control_plane_digest }}"

      - name: Verify the signatures the way the cluster will
        run: |
          for ref in "${IMAGE_NAME}@${{ steps.assemble.outputs.api_digest }}" \
                     "${IMAGE_NAME}-operator@${{ steps.assemble.outputs.operator_digest }}" \
                     "${IMAGE_NAME}-control-plane@${{ steps.assemble.outputs.control_plane_digest }}"; do
            repo="${ref%@*}"
            # The index, plus every platform a cluster could resolve to. Verifying
            # only the index would re-check the exact digest the step above signed,
            # which is a check that cannot fail for the reason it exists.
            children=$(docker buildx imagetools inspect "$ref" --raw \
              | jq -r '.manifests[]
                       | select(.platform.architecture != null and .platform.architecture != "unknown")
                       | .digest')
            for digest in "${ref#*@}" $children; do
              cosign verify "${repo}@${digest}" \
                --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                > /dev/null
              echo "verified: ${repo}@${digest}"
            done
          done
