<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Damga</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:,">
</head>
<body>

<main id="signin" hidden>
  <form id="signin-form" class="card">
    <h1>Damga</h1>
    <p class="muted">Ne çalıştığını görmek için giriş yapın.</p>
    <label>E-posta<input type="email" name="email" autocomplete="username" required></label>
    <label>Parola<input type="password" name="password" autocomplete="current-password" required></label>
    <p id="signin-error" class="error" role="alert" hidden></p>
    <button type="submit">Giriş yap</button>
  </form>
  <p class="muted footnote">
    Henüz hesabınız yok mu? İlk hesap sunucuda oluşturulur:
    <code>damga bootstrap -email you@example.com -tenant acme</code>
  </p>
</main>

<div id="app" hidden>
  <header>
    <span class="brand">Damga</span>
    <select id="tenant" aria-label="Kiracı"></select>
    <span class="spacer"></span>
    <span id="who" class="muted"></span>
    <button id="signout" class="link">Çıkış yap</button>
  </header>

  <div class="layout">
    <nav id="apps" aria-label="Uygulamalar"></nav>
    <section id="detail">
      <p class="muted empty">Bir uygulama seçin.</p>
    </section>
  </div>
</div>

<!-- Before app.js, and not a module: metrics.js publishes itself on window
     for app.js to find, which is how this page shares code without a build
     step. A module would be deferred and app.js would look for it too early. -->
<script src="/metrics.js"></script>
<script src="/logs.js"></script>
<script src="/catalog.js"></script>
<script src="/exec.js"></script>
<script src="/settings.js"></script>
<script src="/databases.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
